<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Extrator PDF → JSON Simples</title>

  <!-- PDF.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <style>
    :root {
      --bg:       #0d0f1a;
      --surface:  #151828;
      --card:     #1c2035;
      --border:   #2a2f4a;
      --accent:   #6366f1;
      --success:  #10b981;
      --warn:     #f59e0b;
      --danger:   #ef4444;
      --text:     #e2e8f0;
      --muted:    #64748b;
      --code:     'Cascadia Code', 'Fira Code', 'Consolas', monospace;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2.5rem 1.5rem 4rem;
    }

    header { text-align: center; margin-bottom: 2.5rem; }
    header h1 { font-size: 2.2rem; font-weight: 800; color: var(--accent); }
    header p { color: var(--muted); margin-top: .4rem; font-size: .95rem; }

    .wrap { width: 100%; max-width: 860px; display: flex; flex-direction: column; gap: 1.4rem; }

    .drop-zone {
      background: var(--surface);
      border: 2px dashed var(--border);
      border-radius: 1.1rem;
      padding: 3rem 2rem;
      text-align: center;
      cursor: pointer;
      transition: border-color .25s, background .25s, transform .15s;
      user-select: none;
    }
    .drop-zone:hover, .drop-zone.over {
      border-color: var(--accent);
      background: rgba(99,102,241,.06);
    }
    .drop-zone.over { transform: scale(1.015); }
    .drop-zone .ico { font-size: 3.2rem; display: block; margin-bottom: .8rem; }
    .drop-zone .title { font-size: 1.1rem; font-weight: 600; }
    .drop-zone .hint  { font-size: .85rem; color: var(--muted); margin-top: .4rem; }
    #fileInput { display: none; }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 1.1rem;
      overflow: hidden;
      display: none;
    }
    .panel.visible { display: block; }

    .panel-head {
      padding: .9rem 1.4rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .badge {
      padding: .22rem .75rem;
      border-radius: 999px;
      font-size: .72rem;
      font-weight: 700;
    }
    .badge-proc { background: rgba(245,158,11,.18); color: var(--warn); animation: blink 1.2s infinite; }
    .badge-ok   { background: rgba(16,185,129,.18); color: var(--success); }
    .badge-err  { background: rgba(239,68,68,.18); color: var(--danger); }
    @keyframes blink { 0%,100% { opacity:1 } 50% { opacity:.45 } }

    .prog-wrap { padding: 1rem 1.4rem; border-bottom: 1px solid var(--border); }
    .prog-bg { height: 7px; background: var(--border); border-radius: 999px; overflow: hidden; }
    .prog-fill {
      height: 100%;
      background: var(--accent);
      transition: width .35s ease;
      width: 0%;
    }

    .log {
      padding: 1rem 1.4rem;
      height: 200px;
      overflow-y: auto;
      font-family: var(--code);
      font-size: .78rem;
      line-height: 1.6;
    }
    .log::-webkit-scrollbar { width: 4px; }
    .log::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .ll { display: flex; gap: .6rem; animation: fadein .2s ease; }
    @keyframes fadein { from { opacity:0; transform:translateX(-8px) } to { opacity:1; transform:none } }
    .lt { color: var(--muted); min-width: 60px; flex-shrink: 0; }
    .lm { flex: 1; word-break: break-word; }
    .li { color: #7dd3fc; }
    .ls { color: var(--success); }
    .lw { color: var(--warn); }
    .lx { color: var(--danger); }

    .stats {
      display: none;
      grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
      gap: 1rem;
      padding: 1.3rem 1.4rem;
      border-bottom: 1px solid var(--border);
    }
    .stat { background: var(--card); border-radius: .6rem; padding: .85rem 1rem; text-align: center; }
    .stat-val { font-size: 1.4rem; font-weight: 800; color: var(--accent); }
    .stat-lbl { font-size: .72rem; color: var(--muted); margin-top: .2rem; }

    .dl-area { padding: 1.4rem; text-align: center; display: none; }
    .file-info { background: var(--card); border-radius: .6rem; padding: .8rem 1rem; margin-bottom: 1rem; font-size: .83rem; color: var(--muted); }
    .file-info strong { color: var(--text); }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: .5rem;
      padding: .7rem 1.6rem;
      border: none;
      border-radius: .55rem;
      font-size: .95rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform .18s, box-shadow .18s;
    }
    .btn-dl {
      background: var(--success);
      color: #fff;
    }
    .btn-dl:hover { transform: translateY(-2px); box-shadow: 0 6px 22px rgba(16,185,129,.4); }
    .btn-reset {
      background: var(--card);
      color: var(--muted);
      border: 1px solid var(--border);
      margin-left: .6rem;
    }
  </style>
</head>
<body>

<header>
  <h1>PDF → JSON Simples</h1>
  <p>Extrai apenas o texto bruto do PDF</p>
</header>

<div class="wrap">
  <div class="drop-zone" id="dropZone" role="button" tabindex="0">
    <span class="ico">📄</span>
    <p class="title">Arraste o PDF aqui ou clique</p>
    <p class="hint">Texto bruto, uma página por item</p>
    <input type="file" id="fileInput" accept=".pdf" />
  </div>

  <div class="panel" id="panel">
    <div class="panel-head">
      <span>Processando…</span>
      <span class="badge badge-proc" id="badge">Processando</span>
    </div>

    <div class="prog-wrap">
      <div class="prog-bg"><div class="prog-fill" id="progFill"></div></div>
    </div>

    <div class="log" id="log"></div>

    <div class="stats" id="stats">
      <div class="stat"><div class="stat-val" id="s-pag">–</div><div class="stat-lbl">Páginas</div></div>
      <div class="stat"><div class="stat-val" id="s-wrd">–</div><div class="stat-lbl">Palavras</div></div>
      <div class="stat"><div class="stat-val" id="s-chr">–</div><div class="stat-lbl">Caracteres</div></div>
    </div>

    <div class="dl-area" id="dlArea">
      <div class="file-info">Arquivo pronto: <strong id="dlName"></strong></div>
      <button class="btn btn-dl" id="dlBtn">⬇ Baixar JSON</button>
      <button class="btn btn-reset" id="resetBtn">Novo</button>
    </div>
  </div>
</div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const CMAP_URL = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/cmaps/';
const SFONT_URL = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/standard_fonts/';

const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const panel = document.getElementById('panel');
const logEl = document.getElementById('log');
const progFill = document.getElementById('progFill');
const badge = document.getElementById('badge');
const statsEl = document.getElementById('stats');
const dlArea = document.getElementById('dlArea');
const dlBtn = document.getElementById('dlBtn');
const dlName = document.getElementById('dlName');
const resetBtn = document.getElementById('resetBtn');

let resultBlob = null;
let resultFilename = '';

dropZone.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', e => e.target.files[0] && run(e.target.files[0]));

dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('over'));
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('over');
  const f = e.dataTransfer.files[0];
  if (f) run(f);
});

dlBtn.addEventListener('click', () => {
  if (!resultBlob) return;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(resultBlob);
  a.download = resultFilename;
  a.click();
});

resetBtn.addEventListener('click', () => {
  panel.classList.remove('visible');
  fileInput.value = '';
  resultBlob = null;
});

function lg(msg, cls = 'li') {
  const row = document.createElement('div');
  row.className = 'll';
  const t = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  const m = document.createElement('span');
  m.className = `lm ${cls}`;
  m.textContent = msg;
  row.innerHTML = `<span class="lt">${t}</span>`;
  row.appendChild(m);
  logEl.appendChild(row);
  logEl.scrollTop = logEl.scrollHeight;
}

function setProgress(pct) {
  progFill.style.width = pct + '%';
}

function setStat(id, val) {
  document.getElementById(id).textContent = typeof val === 'number' ? val.toLocaleString('pt-BR') : val;
}

async function run(file) {
  resultBlob = null;
  logEl.innerHTML = '';
  statsEl.style.display = 'none';
  dlArea.style.display = 'none';
  badge.className = 'badge badge-proc';
  badge.textContent = 'Processando';
  panel.classList.add('visible');
  setProgress(0);

  resultFilename = file.name.replace(/\.pdf$/i, '') + '.json';
  dlName.textContent = resultFilename;
  lg(`📂 ${file.name}`, 'li');

  try {
    const buf = await file.arrayBuffer();
    lg('✓ Carregado', 'ls');

    const pdf = await pdfjsLib.getDocument({
      data: buf,
      cMapUrl: CMAP_URL,
      cMapPacked: true,
      standardFontDataUrl: SFONT_URL,
    }).promise;

    const result = { filename: file.name, totalPages: pdf.numPages, pages: [], fullText: '' };
    let totWords = 0, totChars = 0;
    const fullParts = [];

    for (let p = 1; p <= pdf.numPages; p++) {
      setProgress((p / pdf.numPages) * 100);
      const page = await pdf.getPage(p);
      const tc = await page.getTextContent();
      const items = tc.items.filter(it => typeof it.str === 'string');

      if (!items.length) {
        result.pages.push({ page: p, text: '' });
        continue;
      }

      // Agrupa por posição Y (linhas)
      const lineMap = {};
      items.forEach(it => {
        const y = Math.round(it.transform[5]);
        if (!lineMap[y]) lineMap[y] = [];
        lineMap[y].push(it);
      });

      // Ordena de cima para baixo, esquerda para direita
      const pageText = Object.keys(lineMap)
        .sort((a, b) => b - a)
        .map(y => lineMap[y].sort((a, b) => a.transform[4] - b.transform[4]).map(it => it.str).join('').trim())
        .filter(Boolean)
        .join('\n');

      result.pages.push({ page: p, text: pageText });
      fullParts.push(pageText);

      const words = pageText.split(/\s+/).filter(Boolean).length;
      totWords += words;
      totChars += pageText.length;
      lg(`  Página ${p}: ${words} palavras`, 'li');
    }

    result.fullText = fullParts.join('\n\n');
    setProgress(100);

    lg(`✓ ${pdf.numPages} página(s)`, 'ls');
    lg(`✓ ${totWords.toLocaleString('pt-BR')} palavras`, 'ls');

    setStat('s-pag', pdf.numPages);
    setStat('s-wrd', totWords);
    setStat('s-chr', totChars);
    statsEl.style.display = 'grid';

    const json = JSON.stringify(result, null, 2);
    resultBlob = new Blob([json], { type: 'application/json;charset=utf-8' });
    dlArea.style.display = 'block';
    badge.className = 'badge badge-ok';
    badge.textContent = 'Concluído ✓';

  } catch (err) {
    lg(`✗ ${err.message}`, 'lx');
    badge.className = 'badge badge-err';
    badge.textContent = 'Erro';
  }
}
</script>
</body>
</html>
