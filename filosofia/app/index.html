<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pensadores</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Cinzel:wght@400;600&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root {
  --bg:         #0e0d0c;
  --text:       #d4cfc8;
  --muted:      #6b6560;
  --border:     rgba(255,255,255,.06);

  --c-filosofia:  #1a1510;
  --c-psicologia: #0f1218;
  --c-budismo:    #101510;
  --c-historia:   #140f0f;
  --c-ciencia:    #0c1218;
  --c-outros:     #130f18;
  --c-cristianismo: #001a18;

  --acc-filosofia:  #c9a96e;
  --acc-psicologia: #7ea8c9;
  --acc-budismo:    #7eb89a;
  --acc-historia:   #c97e7e;
  --acc-ciencia:    #7ea8c9;
  --acc-outros:     #a87ec9;
  --acc-cristianismo: #00ffe7;

  --font-display: 'Cinzel', serif;
  --font-body:    'Cormorant Garamond', serif;
  --font-mono:    'DM Mono', monospace;
}

html,body {
  min-height:100vh;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.6;
  overflow-x: hidden;
}

body::before {
  content:'';
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:0;
  opacity:.35;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
  background-size: 200px 200px;
  mix-blend-mode: overlay;
}

header {
  position: relative;
  z-index: 2;
  text-align: center;
  padding: 3.5rem 2rem 2.5rem;
  border-bottom: 1px solid var(--border);
}

header h1 {
  font-family: var(--font-display);
  font-size: clamp(1.4rem, 4vw, 2.4rem);
  font-weight: 400;
  letter-spacing: .25em;
  color: #e8e0d4;
  text-transform: uppercase;
}

header p {
  margin-top: .6rem;
  font-size: .85rem;
  font-style: italic;
  color: var(--muted);
  letter-spacing: .05em;
}

/* ── Data tools (download/upload JSON) ── */
#data-tools {
  position: absolute;
  bottom: 1.2rem;
  right: 1.6rem;
  display: flex;
  gap: .5rem;
}
#data-tools button,
#data-tools label {
  background: none;
  border: 1px solid rgba(255,255,255,.07);
  border-radius: 3px;
  color: var(--muted);
  font-family: var(--font-mono);
  font-size: .55rem;
  letter-spacing: .15em;
  text-transform: uppercase;
  padding: .35rem .7rem;
  cursor: pointer;
  transition: border-color .2s, color .2s;
  line-height: 1;
  user-select: none;
}
#data-tools button:hover,
#data-tools label:hover {
  border-color: rgba(255,255,255,.2);
  color: var(--text);
}

/* ── Add thinker button in header ── */
#btn-add-thinker {
  margin-top: 1.4rem;
  background: none;
  border: 1px solid rgba(255,255,255,.1);
  border-radius: 3px;
  color: var(--muted);
  font-family: var(--font-mono);
  font-size: .62rem;
  letter-spacing: .2em;
  text-transform: uppercase;
  padding: .45rem 1rem;
  cursor: pointer;
  transition: border-color .2s, color .2s;
}
#btn-add-thinker:hover {
  border-color: rgba(255,255,255,.25);
  color: var(--text);
}

main {
  position: relative;
  z-index: 2;
  max-width: 1400px;
  margin: 0 auto;
  padding: 3rem 2rem 6rem;
  display: flex;
  flex-direction: column;
  gap: 3.5rem;
}

.area { display: flex; flex-direction: column; gap: 1.2rem; }

.area-header { display: flex; align-items: center; gap: 1rem; }

.area-label {
  font-family: var(--font-display);
  font-size: .68rem;
  letter-spacing: .3em;
  text-transform: uppercase;
  color: var(--area-acc);
  opacity: .7;
}

.area-line { flex: 1; height: 1px; background: var(--area-acc); opacity: .12; }

.cards-grid { display: flex; flex-wrap: wrap; gap: .75rem; }

.card {
  --area-bg: var(--c-filosofia);
  background: var(--area-bg);
  border: 1px solid color-mix(in srgb, var(--area-acc) 18%, transparent);
  border-radius: 3px;
  padding: .6rem 1.1rem;
  cursor: pointer;
  position: relative;
  transition: transform .2s, border-color .2s, background .2s;
  overflow: hidden;
}
.card::before {
  content:'';
  position:absolute;
  inset:0;
  background: var(--area-acc);
  opacity:0;
  transition: opacity .2s;
}
.card:hover { transform: translateY(-2px); border-color: color-mix(in srgb, var(--area-acc) 50%, transparent); }
.card:hover::before { opacity: .04; }

.card-name {
  position: relative;
  font-family: var(--font-body);
  font-size: .95rem;
  font-weight: 300;
  color: color-mix(in srgb, var(--area-acc) 80%, #e8e0d4);
  letter-spacing: .04em;
  white-space: nowrap;
}

.card[data-area="filosofia"]    { --area-bg: var(--c-filosofia);    --area-acc: var(--acc-filosofia);    }
.card[data-area="psicologia"]   { --area-bg: var(--c-psicologia);   --area-acc: var(--acc-psicologia);   }
.card[data-area="budismo"]      { --area-bg: var(--c-budismo);      --area-acc: var(--acc-budismo);      }
.card[data-area="historia"]     { --area-bg: var(--c-historia);     --area-acc: var(--acc-historia);     }
.card[data-area="ciencia"]      { --area-bg: var(--c-ciencia);      --area-acc: var(--acc-ciencia);      }
.card[data-area="outros"]       { --area-bg: var(--c-outros);       --area-acc: var(--acc-outros);       }
.card[data-area="cristianismo"] { --area-bg: var(--c-cristianismo); --area-acc: var(--acc-cristianismo); }

/* ── Overlay ── */
#overlay {
  position:fixed; inset:0; z-index:50;
  background: rgba(8,7,6,.85);
  backdrop-filter: blur(18px) saturate(.6);
  -webkit-backdrop-filter: blur(18px) saturate(.6);
  opacity:0; pointer-events:none;
  transition: opacity .35s;
}
#overlay.active { opacity:1; pointer-events:all; }

/* ── Popup ── */
#popup {
  position:fixed; inset:0; z-index:60;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  opacity:0; pointer-events:none;
  transition: opacity .35s;
}
#popup.active { opacity:1; pointer-events:all; }

#popup-close {
  position:absolute; top:1.5rem; right:2rem;
  background:none; border:none;
  color:var(--muted); font-size:1.6rem;
  cursor:pointer; line-height:1;
  transition: color .2s; z-index:5;
}
#popup-close:hover { color:var(--text); }

/* delete thinker btn */
#btn-delete-thinker {
  position: absolute;
  top: 1.5rem;
  left: 2rem;
  background: none;
  border: none;
  color: var(--muted);
  font-family: var(--font-mono);
  font-size: .58rem;
  letter-spacing: .15em;
  text-transform: uppercase;
  cursor: pointer;
  transition: color .2s;
  z-index: 5;
}
#btn-delete-thinker:hover { color: #c97e7e; }

#popup-title {
  font-family: var(--font-display);
  font-size: clamp(1rem, 3vw, 1.6rem);
  letter-spacing: .2em;
  font-weight: 400;
  color: #e8e0d4;
  text-transform: uppercase;
  margin-bottom: 2.5rem;
  opacity: .9;
}

#popup-scroll {
  width: min(640px, 92vw);
  height: min(520px, 75vh);
  overflow-y: scroll;
  scroll-snap-type: y mandatory;
  scrollbar-width: none;
  -ms-overflow-style: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1.8rem;
  padding: 2rem 0;
  -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 18%, black 82%, transparent 100%);
  mask-image: linear-gradient(to bottom, transparent 0%, black 18%, black 82%, transparent 100%);
}
#popup-scroll::-webkit-scrollbar { display: none; }

/* ── Add card button inside scroll ── */
.add-card-btn {
  flex-shrink: 0;
  width: 100%;
  background: none;
  border: 1px dashed rgba(255,255,255,.1);
  border-radius: 4px;
  padding: 1.2rem;
  color: var(--muted);
  font-family: var(--font-mono);
  font-size: .6rem;
  letter-spacing: .2em;
  text-transform: uppercase;
  cursor: pointer;
  transition: border-color .2s, color .2s;
}
.add-card-btn:hover { border-color: rgba(255,255,255,.25); color: var(--text); }

/* ── Quote cards ── */
.quote-card {
  scroll-snap-align: center;
  width: 100%;
  background: rgba(255,255,255,.03);
  border: 1px solid rgba(255,255,255,.06);
  border-radius: 4px;
  padding: 2rem 2.4rem;
  transition: transform .4s cubic-bezier(.22,1,.36,1), opacity .4s, background .4s, border-color .4s;
  opacity: .35;
  transform: scale(.92);
  flex-shrink: 0;
  position: relative;
}
.quote-card.focus {
  opacity:1; transform:scale(1);
  background: rgba(255,255,255,.055);
  border-color: rgba(255,255,255,.12);
}
/* sentinel padding elements so first/last cards can reach center */
.scroll-sentinel { flex-shrink: 0; width: 100%; pointer-events: none; }
.quote-card .qc-label {
  font-family: var(--font-mono);
  font-size: .62rem;
  letter-spacing: .15em;
  color: var(--popup-acc, var(--muted));
  text-transform: uppercase;
  margin-bottom: .9rem;
  opacity: .7;
}
.quote-card .qc-label:empty { display: none; }
.quote-card .qc-text {
  font-family: var(--font-body);
  font-size: 1.05rem;
  font-weight: 300;
  line-height: 1.85;
  color: #cec9c2;
  font-style: italic;
}
.quote-card .qc-source {
  margin-top: 1.2rem;
  font-family: var(--font-mono);
  font-size: .65rem;
  color: var(--muted);
  letter-spacing: .08em;
}

/* delete card btn */
.qc-delete {
  position: absolute;
  top: .8rem; right: .9rem;
  background: none; border: none;
  color: transparent;
  font-size: .75rem;
  cursor: pointer;
  transition: color .2s;
  line-height: 1;
  font-family: var(--font-mono);
}
.quote-card:hover .qc-delete,
.quote-card.focus .qc-delete { color: var(--muted); }
.qc-delete:hover { color: #c97e7e !important; }

/* ── Modal (add thinker / add card) ── */
#modal-overlay {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(8,7,6,.92);
  backdrop-filter: blur(24px);
  display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none;
  transition: opacity .25s;
}
#modal-overlay.active { opacity: 1; pointer-events: all; }

#modal {
  width: min(480px, 92vw);
  background: #141210;
  border: 1px solid rgba(255,255,255,.08);
  border-radius: 6px;
  padding: 2.2rem 2.4rem;
  display: flex; flex-direction: column; gap: 1.2rem;
}

#modal h2 {
  font-family: var(--font-display);
  font-size: .8rem;
  letter-spacing: .25em;
  text-transform: uppercase;
  color: #e8e0d4;
  font-weight: 400;
}

.field { display: flex; flex-direction: column; gap: .4rem; }

.field label {
  font-family: var(--font-mono);
  font-size: .58rem;
  letter-spacing: .15em;
  text-transform: uppercase;
  color: var(--muted);
}

.field input,
.field textarea,
.field select {
  background: rgba(255,255,255,.04);
  border: 1px solid rgba(255,255,255,.08);
  border-radius: 3px;
  color: var(--text);
  font-family: var(--font-body);
  font-size: .95rem;
  padding: .55rem .8rem;
  outline: none;
  transition: border-color .2s;
  resize: vertical;
}
.field input:focus,
.field textarea:focus,
.field select:focus { border-color: rgba(255,255,255,.22); }
.field select option { background: #141210; }
.field textarea { min-height: 100px; }

.modal-actions { display: flex; gap: .75rem; justify-content: flex-end; margin-top: .4rem; }

.btn-cancel {
  background: none; border: 1px solid rgba(255,255,255,.08);
  border-radius: 3px; color: var(--muted);
  font-family: var(--font-mono); font-size: .6rem;
  letter-spacing: .15em; text-transform: uppercase;
  padding: .5rem 1rem; cursor: pointer;
  transition: border-color .2s, color .2s;
}
.btn-cancel:hover { border-color: rgba(255,255,255,.2); color: var(--text); }

.btn-confirm {
  background: rgba(255,255,255,.06);
  border: 1px solid rgba(255,255,255,.14);
  border-radius: 3px; color: #e8e0d4;
  font-family: var(--font-mono); font-size: .6rem;
  letter-spacing: .15em; text-transform: uppercase;
  padding: .5rem 1.2rem; cursor: pointer;
  transition: background .2s, border-color .2s;
}
.btn-confirm:hover { background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.25); }
.btn-confirm:disabled { opacity: .35; cursor: not-allowed; }

/* ── Toast ── */
#toast {
  position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%) translateY(1rem);
  z-index: 200;
  background: #1e1c1a; border: 1px solid rgba(255,255,255,.1);
  border-radius: 4px; padding: .6rem 1.2rem;
  font-family: var(--font-mono); font-size: .62rem;
  letter-spacing: .12em; text-transform: uppercase;
  color: var(--text); opacity: 0;
  transition: opacity .25s, transform .25s;
  pointer-events: none;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── Loading state ── */
#loading {
  position: fixed; inset: 0; z-index: 300;
  background: var(--bg);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-mono); font-size: .62rem;
  letter-spacing: .25em; text-transform: uppercase;
  color: var(--muted);
  transition: opacity .4s;
}
#loading.fade { opacity: 0; pointer-events: none; }
</style>
</head>
<body>

<div id="loading">carregando</div>

<header>
  <h1>Pensadores</h1>
  <button id="btn-add-thinker">+ pensador</button>
  <div id="data-tools">
    <button id="btn-download-json" title="baixar dados como JSON">↓ json</button>
    <label id="btn-upload-json-label" title="importar JSON para o Firestore">
      ↑ json
      <input type="file" id="btn-upload-json" accept=".json" style="display:none">
    </label>
  </div>
</header>

<main id="main-content"></main>

<div id="overlay"></div>

<div id="popup" role="dialog" aria-modal="true">
  <button id="btn-delete-thinker">— remover</button>
  <button id="popup-close" aria-label="Fechar">×</button>
  <div id="popup-title"></div>
  <div id="popup-scroll"></div>
</div>

<!-- add thinker / add card modal -->
<div id="modal-overlay">
  <div id="modal">
    <h2 id="modal-title">novo pensador</h2>
    <div id="modal-fields"></div>
    <div class="modal-actions">
      <button class="btn-cancel" id="modal-cancel">cancelar</button>
      <button class="btn-confirm" id="modal-confirm">salvar</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script type="module">
import { initializeApp }    from 'https://www.gstatic.com/firebasejs/11.7.1/firebase-app.js';
import {
  getFirestore, collection, doc,
  getDocs, setDoc, deleteDoc, updateDoc, onSnapshot,
} from 'https://www.gstatic.com/firebasejs/11.7.1/firebase-firestore.js';

/* ── Firebase ───────────────────────────────────────────────────── */
const app = initializeApp({
  apiKey:            'AIzaSyBDNz5u4T7OeaVu2wdZU041RRnnmdmlt5g',
  authDomain:        'filosofia-3eae2.firebaseapp.com',
  projectId:         'filosofia-3eae2',
  storageBucket:     'filosofia-3eae2.firebasestorage.app',
  messagingSenderId: '623138302529',
  appId:             '1:623138302529:web:4164b602e9b0e45c9d74c0',
});
const db   = getFirestore(app);
const COLL = 'thinkers'; // colecao separada do grafo

/* ── Areas ──────────────────────────────────────────────────────── */
const AREAS = [
  { id:'filosofia',    label:'Filosofia' },
  { id:'psicologia',   label:'Psicologia' },
  { id:'budismo',      label:'Budismo & Oriente' },
  { id:'cristianismo', label:'Cristianismo' },
  { id:'historia',     label:'História & Cultura' },
  { id:'ciencia',      label:'Filosofia da Ciência' },
  { id:'outros',       label:'Outros' },
];
const AREA_ACC = {
  filosofia:    'var(--acc-filosofia)',
  psicologia:   'var(--acc-psicologia)',
  budismo:      'var(--acc-budismo)',
  cristianismo: 'var(--acc-cristianismo)',
  historia:     'var(--acc-historia)',
  ciencia:      'var(--acc-ciencia)',
  outros:       'var(--acc-outros)',
};

/* ── State ──────────────────────────────────────────────────────── */
let thinkers = {}; // { id: { name, area, acc, cards:[] } }
let currentThinker = null;

/* ── DOM refs ───────────────────────────────────────────────────── */
const mainEl        = document.getElementById('main-content');
const overlay       = document.getElementById('overlay');
const popup         = document.getElementById('popup');
const popupTitle    = document.getElementById('popup-title');
const popupScroll   = document.getElementById('popup-scroll');
const closeBtn      = document.getElementById('popup-close');
const deleteThinker = document.getElementById('btn-delete-thinker');
const addThinkerBtn = document.getElementById('btn-add-thinker');
const modalOverlay  = document.getElementById('modal-overlay');
const modalTitle    = document.getElementById('modal-title');
const modalFields   = document.getElementById('modal-fields');
const modalCancel   = document.getElementById('modal-cancel');
const modalConfirm  = document.getElementById('modal-confirm');
const loadingEl     = document.getElementById('loading');
const toastEl       = document.getElementById('toast');

/* ── Toast ──────────────────────────────────────────────────────── */
let toastTimer;
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2200);
}

/* ── Render ─────────────────────────────────────────────────────── */
function render() {
  mainEl.innerHTML = '';

  AREAS.forEach(area => {
    const list = Object.entries(thinkers)
      .filter(([,t]) => t.area === area.id)
      .sort(([,a],[,b]) => a.name.localeCompare(b.name, 'pt'));

    if (!list.length) return;

    const section = document.createElement('section');
    section.className = 'area';
    section.style.setProperty('--area-acc', AREA_ACC[area.id]);
    section.innerHTML = `
      <div class="area-header">
        <span class="area-label">${area.label}</span>
        <span class="area-line"></span>
      </div>
      <div class="cards-grid" data-area="${area.id}"></div>
    `;

    const grid = section.querySelector('.cards-grid');
    list.forEach(([id, t]) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.area = area.id;
      card.dataset.id   = id;
      card.innerHTML = `<span class="card-name">${t.name}</span>`;
      card.addEventListener('click', () => openPopup(id));
      grid.appendChild(card);
    });

    mainEl.appendChild(section);
  });
}

/* ── Popup ──────────────────────────────────────────────────────── */
function openPopup(id) {
  currentThinker = id;
  const t = thinkers[id];
  popupTitle.textContent = t.name;
  popup.style.setProperty('--popup-acc', t.acc || '#c9a96e');
  renderPopupCards(t);
  overlay.classList.add('active');
  popup.classList.add('active');
  document.body.style.overflow = 'hidden';
  popupScroll.scrollTop = 0;
  updateFocus();
}

function renderPopupCards(t) {
  popupScroll.innerHTML = '';
  const cards = t.cards || [];

  // top sentinel — half the scroll container height so first card can center
  const topSentinel = document.createElement('div');
  topSentinel.className = 'scroll-sentinel';
  topSentinel.style.height = (popupScroll.clientHeight / 2) + 'px';
  popupScroll.appendChild(topSentinel);

  cards.forEach((c, i) => {
    const card = document.createElement('div');
    card.className = 'quote-card' + (i === 0 ? ' focus' : '');
    card.innerHTML = `
      <div class="qc-label">${c.label||''}</div>
      <div class="qc-text">${c.text}</div>
      ${c.source ? `<div class="qc-source">${c.source}</div>` : ''}
      <button class="qc-delete" data-idx="${i}" title="remover card">×</button>
    `;
    card.querySelector('.qc-delete').addEventListener('click', e => {
      e.stopPropagation();
      removeCard(currentThinker, i);
    });
    popupScroll.appendChild(card);
  });

  // add card button
  const addBtn = document.createElement('button');
  addBtn.className = 'add-card-btn';
  addBtn.textContent = '+ novo card';
  addBtn.addEventListener('click', () => openAddCardModal(currentThinker));
  popupScroll.appendChild(addBtn);

  if (!cards.length) {
    const ph = document.createElement('div');
    ph.className = 'quote-card focus';
    ph.style.cssText = 'opacity:.5;transform:none;';
    ph.innerHTML = `<div class="qc-label">em construção</div><div class="qc-text">Nenhum card ainda.</div>`;
    popupScroll.insertBefore(ph, addBtn);
  }

  // bottom sentinel
  const botSentinel = document.createElement('div');
  botSentinel.className = 'scroll-sentinel';
  botSentinel.style.height = (popupScroll.clientHeight / 2) + 'px';
  popupScroll.appendChild(botSentinel);
}

function closePopup() {
  overlay.classList.remove('active');
  popup.classList.remove('active');
  document.body.style.overflow = '';
  currentThinker = null;
}

closeBtn.addEventListener('click', closePopup);
overlay.addEventListener('click', e => { if (e.target === overlay) closePopup(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeModal(); closePopup(); } });

/* ── Scroll focus ───────────────────────────────────────────────── */
function updateFocus() {
  const cards = [...popupScroll.querySelectorAll('.quote-card')];
  if (!cards.length) return;
  const mid = popupScroll.scrollTop + popupScroll.clientHeight / 2;
  let closest = null, dist = Infinity;
  cards.forEach(c => {
    const d = Math.abs((c.offsetTop + c.offsetHeight / 2) - mid);
    if (d < dist) { dist = d; closest = c; }
  });
  cards.forEach(c => c.classList.toggle('focus', c === closest));
}
popupScroll.addEventListener('scroll', updateFocus, { passive: true });

/* ── Delete thinker ─────────────────────────────────────────────── */
deleteThinker.addEventListener('click', async () => {
  if (!currentThinker) return;
  const name = thinkers[currentThinker]?.name;
  if (!confirm(`Remover "${name}" permanentemente?`)) return;
  try {
    await deleteDoc(doc(db, COLL, currentThinker));
    delete thinkers[currentThinker];
    closePopup();
    render();
    toast('pensador removido');
  } catch(e) {
    toast('erro ao remover');
    console.error(e);
  }
});

/* ── Remove card ────────────────────────────────────────────────── */
async function removeCard(thinkerId, idx) {
  const t = thinkers[thinkerId];
  const cards = [...(t.cards || [])];
  cards.splice(idx, 1);
  try {
    await updateDoc(doc(db, COLL, thinkerId), { cards });
    thinkers[thinkerId].cards = cards;
    renderPopupCards(thinkers[thinkerId]);
    updateFocus();
    toast('card removido');
  } catch(e) {
    toast('erro ao remover card');
    console.error(e);
  }
}

/* ── Modal logic ────────────────────────────────────────────────── */
let modalCallback = null;

function openModal(title, fields, onConfirm) {
  modalTitle.textContent = title;
  modalFields.innerHTML = '';
  fields.forEach(f => {
    const wrap = document.createElement('div');
    wrap.className = 'field';
    if (f.type === 'select') {
      wrap.innerHTML = `<label>${f.label}</label>
        <select id="mf-${f.id}">
          ${f.options.map(o => `<option value="${o.value}">${o.label}</option>`).join('')}
        </select>`;
    } else if (f.type === 'textarea') {
      wrap.innerHTML = `<label>${f.label}</label>
        <textarea id="mf-${f.id}" placeholder="${f.placeholder||''}" rows="${f.rows||4}"></textarea>`;
    } else {
      wrap.innerHTML = `<label>${f.label}</label>
        <input id="mf-${f.id}" type="text" placeholder="${f.placeholder||''}">`;
    }
    modalFields.appendChild(wrap);
  });
  modalCallback = onConfirm;
  modalOverlay.classList.add('active');
}

function closeModal() {
  modalOverlay.classList.remove('active');
  modalCallback = null;
}

function getModalValues(fields) {
  const vals = {};
  fields.forEach(f => {
    const el = document.getElementById(`mf-${f.id}`);
    vals[f.id] = el ? el.value.trim() : '';
  });
  return vals;
}

modalCancel.addEventListener('click', closeModal);
modalConfirm.addEventListener('click', () => { if (modalCallback) modalCallback(); });

/* ── Add thinker ────────────────────────────────────────────────── */
addThinkerBtn.addEventListener('click', () => {
  const fields = [
    { id:'name',  label:'Nome',  type:'text', placeholder:'ex: Simone de Beauvoir' },
    { id:'id',    label:'ID (slug)', type:'text', placeholder:'ex: beauvoir' },
    { id:'area',  label:'Área',  type:'select', options: AREAS.map(a => ({ value: a.id, label: a.label })) },
  ];
  openModal('novo pensador', fields, async () => {
    const v = getModalValues(fields);
    if (!v.name || !v.id) { toast('nome e id obrigatórios'); return; }
    const id = v.id.toLowerCase().replace(/\s+/g,'-').replace(/[^a-z0-9-]/g,'');
    if (thinkers[id]) { toast('id já existe'); return; }
    modalConfirm.disabled = true;
    try {
      const data = { name: v.name, area: v.area, acc: '#c9a96e', cards: [] };
      await setDoc(doc(db, COLL, id), data);
      thinkers[id] = data;
      closeModal();
      render();
      toast('pensador adicionado');
    } catch(e) {
      toast('erro ao salvar');
      console.error(e);
    } finally {
      modalConfirm.disabled = false;
    }
  });
});

/* ── Add card ───────────────────────────────────────────────────── */
function openAddCardModal(thinkerId) {
  const fields = [
    { id:'text',   label:'Texto',  type:'textarea',  placeholder:'Conteúdo do card...', rows:5 },
    { id:'source', label:'Fonte',  type:'text',     placeholder:'ex: Além do Bem e do Mal, §36' },
  ];
  openModal('novo card', fields, async () => {
    const v = getModalValues(fields);
    if (!v.text) { toast('texto obrigatório'); return; }
    const cards = [...(thinkers[thinkerId].cards || []), { label: '', text: v.text, source: v.source }];
    modalConfirm.disabled = true;
    try {
      await updateDoc(doc(db, COLL, thinkerId), { cards });
      thinkers[thinkerId].cards = cards;
      closeModal();
      renderPopupCards(thinkers[thinkerId]);
      // scroll to new card
      setTimeout(() => {
        const all = popupScroll.querySelectorAll('.quote-card');
        all[all.length - 1]?.scrollIntoView({ behavior:'smooth', block:'center' });
        updateFocus();
      }, 100);
      toast('card adicionado');
    } catch(e) {
      toast('erro ao salvar card');
      console.error(e);
    } finally {
      modalConfirm.disabled = false;
    }
  });
}

/* ── Firestore load ─────────────────────────────────────────────── */
async function loadAndRender() {
  try {
    const snap = await getDocs(collection(db, COLL));
    thinkers = {};
    snap.forEach(d => { thinkers[d.id] = d.data(); });
  } catch(e) {
    console.error('Firestore load error:', e);
  }
  render();
  loadingEl.classList.add('fade');
  setTimeout(() => loadingEl.remove(), 500);
}

/* ── JSON download / upload ─────────────────────────────────────── */
document.getElementById('btn-download-json').addEventListener('click', () => {
  const json = JSON.stringify(thinkers, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url; a.download = 'pensadores.json';
  a.click();
  URL.revokeObjectURL(url);
  toast('json baixado');
});

document.getElementById('btn-upload-json').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  try {
    const text = await file.text();
    const data = JSON.parse(text);
    if (typeof data !== 'object' || Array.isArray(data)) { toast('json inválido'); return; }
    const ids = Object.keys(data);
    if (!ids.length) { toast('nenhum dado'); return; }
    if (!confirm(`Importar ${ids.length} pensador(es)? Itens existentes com mesmo ID serão sobrescritos.`)) return;
    toast('importando...');
    let count = 0;
    for (const [id, val] of Object.entries(data)) {
      await setDoc(doc(db, COLL, id), val);
      thinkers[id] = val;
      count++;
    }
    render();
    toast(`${count} pensador(es) importados`);
  } catch(err) {
    toast('erro ao importar');
    console.error(err);
  }
  e.target.value = '';
});

loadAndRender();
</script>

</html>
