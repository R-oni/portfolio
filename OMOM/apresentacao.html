        <img src="assets/apresentacao/tira14.webp" alt="tira14">

<script>
// ===== SISTEMA DE MÚSICA POR INTERVALOS DE SCROLL (ABSOLUTO) =====
// Cada música é independente e tem seu próprio intervalo de ativação
// Ponto de referência: centro da viewport (scrollY + innerHeight/2)

const logScrollPos = true;  // true para ver posição no console
const FADE_TIME = 3000;     // ms para fade in/out completo (3 segundos - muito suave)
const CHECK_DELAY = 80;     // ms entre verificações (debounce)

// CONFIGURAÇÃO DE FAIXAS - TOTALMENTE INDEPENDENTES
// Cada track define seu próprio intervalo e não depende das outras
const TRACKS = [
    { 
        id: 'memories',      
        src: 'memories.mp3',     
        maxVolume: 0.8,
        start: 1,           // inicia fade in quando centro estiver após 1px
        end: 500           // inicia fade out quando centro ultrapassar 2000px
    },
    { 
        id: 'radiacao',  
        src: 'mundos/ofcmapaonei/radiacao.mp3', 
        maxVolume: 0.1,
        start: 850,        // pode se sobrepor com outras faixas
        end: 6000           // fade out independente
    },
    { 
        id: 'tron',  
        src: 'mundos/ofcmapaonei/tron.mp3', 
        maxVolume: 0.9,
        start: 1000,        // pode se sobrepor com outras faixas
        end: 7000           // fade out independente
    },
    { 
        id: 'lunar',  
        src: 'mundos/araporu/yourlunarway.mp3', 
        maxVolume: 0.9,
        start: 7001,        // pode se sobrepor com outras faixas
        end: 50000           // fade out independente
    } 
];

// ==== IMPLEMENTAÇÃO DO SISTEMA ====
const active = new Map(); // id -> { audio, target, current, state, max, fadeStart }
let scrollTimer = null;
let userInteracted = false;

// Garantir permissão de áudio após interação
['pointerdown','keydown','touchstart'].forEach(ev => {
    window.addEventListener(ev, () => { 
        userInteracted = true; 
        tryStartAll(); 
    }, { once: true });
});

function getCenterPos() {
    return window.scrollY + window.innerHeight / 2;
}

function updateTracks(y) {
    // Verificar cada track individualmente
    TRACKS.forEach(track => {
        const isActive = (y >= track.start && y < track.end);
        const rec = ensureAudio(track);
        
        if (isActive && rec.target === 0) {
            // Ativar (fade in)
            rec.target = rec.max;
            rec.state = 'fading-in';
            rec.fadeStart = performance.now();
            if (logScrollPos) console.log(`Fade IN: ${track.id}`);
        } 
        else if (!isActive && rec.target > 0) {
            // Desativar (fade out)
            rec.target = 0;
            rec.state = 'fading-out';
            rec.fadeStart = performance.now();
            if (logScrollPos) console.log(`Fade OUT: ${track.id}`);
        }
    });
}

function ensureAudio(track) {
    if (active.has(track.id)) return active.get(track.id);
    
    const audio = new Audio(track.src);
    audio.loop = true;
    audio.volume = 0;
    
    const record = {
        audio,
        target: 0,
        current: 0,
        state: 'idle',
        max: track.maxVolume || 1,
        fadeStart: 0
    };
    
    active.set(track.id, record);
    
    // Iniciar áudio se possível
    if (userInteracted) {
        audio.play().catch(() => {});
    }
    
    return record;
}

function tryStartAll() {
    if (!userInteracted) return;
    active.forEach(obj => {
        if (obj.audio.paused && obj.target > 0) {
            obj.audio.play().catch(() => {});
        }
    });
}

function stepFades() {
    const now = performance.now();
    
    active.forEach((rec, id) => {
        if (rec.state === 'idle' || !rec.fadeStart) return;
        
        // Calcular progresso baseado no tempo real (0 a 1)
        const elapsed = now - rec.fadeStart;
        const progress = Math.min(1, elapsed / FADE_TIME);
        
        if (progress >= 1) {
            // Fade completo
            rec.current = rec.target;
            rec.audio.volume = rec.current;
            
            if (rec.target === 0) {
                rec.audio.pause();
                active.delete(id);
            } else {
                rec.state = 'steady';
            }
            return;
        }
        
        // Aplicar curva easeInOut para suavidade no início e fim
        // Esta função transforma um progresso linear (0-1) em uma curva suave em S
        const eased = progress < 0.5
            ? 2 * progress * progress
            : 1 - Math.pow(-2 * progress + 2, 2) / 2;
            
        if (rec.state === 'fading-in') {
            rec.current = rec.target * eased;
        } else {
            rec.current = rec.target + (rec.max - rec.target) * (1 - eased);
        }
        
        rec.audio.volume = rec.current;
        
        // Garantir reprodução mesmo após pause
        if (rec.audio.paused && rec.current > 0 && userInteracted) {
            rec.audio.play().catch(() => {});
        }
    });
}

function onScrollChange() {
    const y = getCenterPos();
    if (logScrollPos) console.log('Posição:', Math.round(y));
    updateTracks(y);
}

function debouncedScroll() {
    if (scrollTimer) clearTimeout(scrollTimer);
    scrollTimer = setTimeout(onScrollChange, CHECK_DELAY);
}

// Iniciar sistema
window.addEventListener('scroll', debouncedScroll, { passive: true });
window.addEventListener('load', () => {
    setTimeout(onScrollChange, 100); // Verificar após carregamento
    requestAnimationFrame(function animate() {
        stepFades();
        requestAnimationFrame(animate);
    });
});

// Expor controle avançado
window.audioControl = {
    tracks: TRACKS,
    // Adicionar faixa durante execução
    addTrack: function(config) {
        TRACKS.push(config);
        onScrollChange(); // Atualizar imediatamente
        return config;
    },
    // Ajustar volumes em tempo real
    setVolume: function(id, vol) {
        if (active.has(id)) {
            const rec = active.get(id);
            rec.target = vol;
            rec.max = vol;
            rec.state = vol > 0 ? 'fading-in' : 'fading-out';
            rec.fadeStart = performance.now();
            return true;
        }
        return false;
    },
    // Forçar reprodução de uma faixa
    play: function(id) {
        const track = TRACKS.find(t => t.id === id);
        if (track) {
            const rec = ensureAudio(track);
            rec.target = rec.max;
            rec.state = 'fading-in';
            rec.fadeStart = performance.now();
            if (userInteracted) rec.audio.play().catch(()=>{});
            return true;
        }
        return false;
    },
    // Parar uma faixa específica
    stop: function(id) {
        if (active.has(id)) {
            const rec = active.get(id);
            rec.target = 0;
            rec.state = 'fading-out';
            rec.fadeStart = performance.now();
            return true;
        }
        return false;
    },
    // Verificar estado atual
    status: function() {
        return Array.from(active.entries()).map(([id, rec]) => ({
            id,
            volume: rec.current,
            target: rec.target,
            state: rec.state
        }));
    }
};
</script>
