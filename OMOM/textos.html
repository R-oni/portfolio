<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0, user-scalable=yes"/>
  <title>OMOM</title>
  <link rel="icon" type="image/webp" href="assets/omom_favicon.webp"/>
  
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Literata:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet"/>
  
  <style>
    /* ===================================================================
       1. ESTILOS BASE (MOBILE-FIRST)
       =================================================================== */
    * { margin:0; padding:0; box-sizing:border-box }
    html, body {
      width:100%; height:100%; overflow:hidden;
      background:#000; color:#fff;
      font-family:'Courier New',monospace;
      transition: background 1s ease;
    }
    
    /* Splash OMOM */
    #omom-screen {
      position:fixed; inset:0;
      display:flex; align-items:center; justify-content:center;
      background:#000; z-index:10;
    }

    @keyframes fadeIn { from{opacity:0} to{opacity:1} }
    @keyframes fadeOut { from{opacity:1} to{opacity:0} }

    /* Prompt Som */
    #soundPrompt {
      position:fixed; inset:0; display:none;
      flex-direction:column; align-items:center; justify-content:center;
      background:#000; z-index:8; text-align:center; margin-top:25vh;
    }
    #soundPrompt p {
      font-family:'Press Start 2P',cursive; font-size:5vw; margin-bottom:4vh; color:#00FFE7;
    }
    .soundBtns { display:flex; gap:4vw; justify-content:center; align-items:center; }
    .soundBtn {
      padding:2vh 4vw; font-family:'Press Start 2P',cursive; font-size:4vw;
      background:none; border:2px solid #00FFE7; color:#00FFE7; cursor:pointer; transition: all 0.3s ease;
    }
    .soundBtn:hover { background:#00FFE7; color:#000; }

    /* Menu de Símbolos */
    #menu {
      position:fixed; inset:0; display:none; flex-direction:column; align-items:center; justify-content:flex-start;
      z-index:7; padding:10vh 5vw 5vh; background:#000; transition: background 1s ease;
      overflow-y: auto; scrollbar-width: none; -ms-overflow-style: none;
    }
    #menu::-webkit-scrollbar { display: none; }
    #menu h1 {
      font-family:'Press Start 2P',cursive; font-size:6vw; color:#fff; margin-bottom:10vh;
      text-align:center; flex-shrink: 0; position: relative;
    }

    .symbols-container {
      display:flex; flex-wrap:wrap; justify-content:center; gap:5vw;
      width:100%; max-width: 1200px; overflow-y: auto; padding-bottom: 0;
      scrollbar-width: none; -ms-overflow-style: none;
    }
    .symbols-container::-webkit-scrollbar { display: none; }
    .symbol {
      cursor:pointer; animation: individualFloat 4s ease-in-out infinite; flex-shrink: 0; position: relative;
    }
    .symbol img { width:24vw; max-width:200px; display:block; }

    /* Mundos bloqueados (Código do cadeado mantido) */
    .symbol.locked img { opacity: 0.35; transition: opacity 0.3s ease; }
    .symbol.locked::after {
      content: ''; background: #00ffe7; width: 5vw; height: 4vw; max-width: 25px; max-height: 20px;
      border-radius: 4px; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -40%);
      opacity: 0; pointer-events: none; transition: opacity 0.2s ease-out; box-shadow: 0 0 8px rgba(0, 255, 231, 0.5);
    }
    .symbol.locked::before {
      content: ''; width: 2.5vw; height: 3vw; max-width: 16px; max-height: 12px;
      border: 0.8vw solid #00ffe7; border-width: min(0.8vw, 5px); border-bottom: none; border-radius: 10px 10px 0 0;
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -110%);
      opacity: 0; pointer-events: none; transition: opacity 0.2s ease-out;
    }
    .symbol.locked.show-lock::after, .symbol.locked.show-lock::before { opacity: 1; }

    .symbol:nth-child(1) { animation-delay: 0s; animation-duration: 6.3s; }
    .symbol:nth-child(2) { animation-delay: -0.8s; animation-duration: 6.1s; }
    .symbol:nth-child(3) { animation-delay: -1.6s; animation-duration: 7.7s; }
    .symbol:nth-child(4) { animation-delay: -2.4s; animation-duration: 8.3s; }
    .symbol:nth-child(5) { animation-delay: -3.2s; animation-duration: 6.9s; }
    .symbol:nth-child(6) { animation-delay: -1.1s; animation-duration: 5.5s; }
    .symbol:nth-child(7) { animation-delay: -2.7s; animation-duration: 6.4s; }
    .symbol:nth-child(8) { animation-delay: -0.5s; animation-duration: 6.2s; }
    .symbol:nth-child(9) { animation-delay: -1.9s; animation-duration: 5.8s; }
    .symbol:nth-child(10) { animation-delay: -3.5s; animation-duration: 4.0s; }
    .symbol:nth-child(11) { animation-delay: -0.3s; animation-duration: 7.6s; }

    @keyframes individualFloat {
      0% { transform: translateY(0px); }
      25% { transform: translateY(-10px); }
      50% { transform: translateY(-6px); }
      75% { transform: translateY(-12px); }
      100% { transform: translateY(0px); }
    }

    /* Flipbook Principal */
    #flipbook {
      position:fixed; inset:0; display:none; background:#fff; z-index:6;
      transition: background 1s ease; overflow-y: auto; overflow-x: hidden;
    }
    #flipbook-content {
      display: flex; flex-direction: column; align-items: center;
      padding: 0 !important; gap: 0 !important; min-height: 100vh;
    }

    /* Voltar */
    #btnVoltar {
      position:fixed; top:2vh; left:5vw; padding:1vh 2vw; font-family:'Press Start 2P',cursive; font-size:3vw;
      background:rgba(0,0,0,0.8); border:2px solid #00FFE7; color:#00FFE7;
      cursor:pointer; display:none; z-index:20; backdrop-filter: blur(5px);
    }

    /* ===================================================================
       2. DESKTOP E EXTRAS
       =================================================================== */
    @media screen and (min-width: 768px) {
      #soundPrompt p { font-size: 1.5rem; }
      .soundBtn { font-size: 1rem; padding: 15px 30px; }
      #menu { padding: 8vh 5vw 3vh; text-align: center; align-items: center; display: none; flex-direction: column; }
      #menu h1 { font-size: 3rem; margin-bottom: 10vh; width: 100%; text-align: center; }
      .symbols-container { gap: 3vw; max-height: 70vh; }
      .symbol img { width: 150px; }
      #btnVoltar { font-size: 12px; padding: 10px 20px; }
      #flipbook { background: #fff !important; }
      @media screen and (min-width: 1024px) {
        #menu { padding: 3vh 0 !important; justify-content: center; width: 100%; }
        #menu h1 { font-size: 2rem !important; margin-bottom: 5vh !important; }
        .symbols-container {
          display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
          gap: 30px; max-width: 1400px; width: 90%; justify-items: center; margin: 0 auto;
        }
      }
    }

    /* Pixels Aleatórios no fundo */
    .background-pixels { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: -1; opacity: 0.4; }
    .pixel { position: absolute; background: #00FFE7; animation: pixelTwinkle 0.1s ease-in-out infinite; }
    @keyframes pixelTwinkle { 0%, 100% { opacity: 0.1; } 50% { opacity: 0.6; } }

    .comics-title { font-family:'Press Start 2P',monospace; font-size:2.2vw; color:#00ffe7; letter-spacing:2px; display:inline-block; }
    .comics-separator { width:100%; display: block; text-align: center; margin: 0 0 2vh 0; clear: both; }

    @media (max-width: 767px) {
      .comics-title { font-size: 6vw !important; }
      .symbols-container { max-height: 90vh; }
    }
    @media (min-width: 768px) {
      .comics-separator { grid-column: 1 / -1 !important; }
      .comics-separator + .symbol { margin-top: 0 !important; }
    }

    /* ===================================================================
       3. ESTILOS DO EDITOR DE TEXTO (INJETADO)
       =================================================================== */
    #layer-texto { width: 100%; height: 100vh; background-color: #000; display: flex; flex-direction: column; overflow: hidden; }
    #texto-pagina {
      width: 100%; height: 100%; margin: 0 auto; background: #ffffff; display: flex; flex-direction: column; overflow: hidden;
    }
    #texto-toolbar {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 8px; padding: 10px; padding-left: 120px;
      background: #000; border-bottom: 1px solid rgba(0, 255, 231, 0.3); flex-shrink: 0;
    }
    #texto-toolbar-edicao { display: none; flex-wrap: wrap; gap: 8px; align-items: center; }
    .texto-btn {
      font-family: 'Press Start 2P', monospace; font-size: 9px; background: rgba(0, 0, 0, 0.85);
      color: #00ffe7; border: 1px solid #00ffe7; border-radius: 4px; padding: 9px 10px; min-height: 36px;
      display: flex; align-items: center; justify-content: center; cursor: pointer; white-space: nowrap;
      transition: background 0.2s, color 0.2s; user-select: none;
    }
    .texto-btn:active { background: #00ffe7; color: #000; }
    #texto-conteudo {
      flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; font-family: 'Literata', serif; font-size: 18px; line-height: 1.7;
      color: #2b2320; padding: 24px 18px 60px; outline: none; width: 100%; text-align: left;
    }
    #texto-conteudo:empty::before { content: 'Toque em EDITAR para começar a escrever.'; font-style: italic; color: rgba(43, 35, 32, 0.4); }

    /* Ilustrações inseridas no texto: wrapper não-editável com botão de editar embaixo */
    .omom-ilustracao { display: block; text-align: center; margin: 16px 0; }
    .omom-ilustracao img { max-width: 100%; display: block; margin: 0 auto; }
    .omom-editar-desenho-btn {
      display: none; margin: 8px auto 0; padding: 6px 12px;
      font-family: 'Press Start 2P', monospace; font-size: 9px;
      background: rgba(0,0,0,0.85); color: #00ffe7; border: 1px solid #00ffe7; border-radius: 4px;
      cursor: pointer; user-select: none;
    }
    .omom-editar-desenho-btn:active { background: #00ffe7; color: #000; }
    #texto-conteudo.modo-edicao .omom-editar-desenho-btn { display: inline-block; }
    
    @media (min-width: 640px) {
      #texto-pagina { max-width: 800px; border-left: 1px solid rgba(0, 255, 231, 0.4); border-right: 1px solid rgba(0, 255, 231, 0.4); box-shadow: 0 0 60px rgba(0, 255, 231, 0.08); }
      #texto-toolbar { padding: 14px 24px; padding-left: 120px; }
      #texto-conteudo { padding: 48px 60px 80px; }
    }

    /* ===================================================================
       4. TELA DE DESENHO (LÁPIS P&B)
       =================================================================== */
    #layer-desenho {
      position: fixed; inset: 0; z-index: 50; background: #111;
      display: flex; flex-direction: column;
    }
    #desenho-toolbar {
      display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px;
      background: #000; border-bottom: 1px solid rgba(0, 255, 231, 0.3); flex-shrink: 0;
    }
    #desenho-canvas-wrap {
      flex: 1; overflow: auto; display: flex; align-items: center; justify-content: center;
      background: #2b2b2b; touch-action: none;
    }
    #desenho-canvas {
      background: #fff; box-shadow: 0 0 40px rgba(0,0,0,0.5); cursor: crosshair;
      touch-action: none;
    }
    #desenho-espessura { accent-color: #00ffe7; }
  </style>
</head>
<body>

  <div id="flipbook">

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://hammerjs.github.io/dist/hammer.min.js"></script>
  
  <script>
    // =========================================================
    // 1. CORREÇÃO DA ANIMAÇÃO OMOM
    // =========================================================
    function initOMOMAnimation() {
      const text = "OMOM";
      const fontSize = 60;
      const fontFamily = "'Press Start 2P', monospace";
      const color = "#fff";
      const pixelSize = 2;
      const appearSpeed = 25;
      const fadeDelay = 3000;
      const fadeDuration = 1200;

      const canvas = document.getElementById('omom-pixel-canvas');
      if (!canvas) return;
      
      canvas.style.display = 'block';
      canvas.style.opacity = '1';
      const ctx = canvas.getContext('2d');

      function resizeCanvas() {
        canvas.width = Math.min(window.innerWidth, 600);
        canvas.height = Math.max(fontSize * 2, Math.min(window.innerHeight * 0.3, 180));
      }
      resizeCanvas();

      document.fonts.load(`bold ${fontSize}px ${fontFamily}`).then(() => {
        function getTextPixels() {
          const off = document.createElement('canvas');
          off.width = canvas.width; off.height = canvas.height;
          const offCtx = off.getContext('2d');
          offCtx.clearRect(0, 0, off.width, off.height);
          offCtx.font = `bold ${fontSize}px ${fontFamily}`;
          offCtx.textAlign = "center"; offCtx.textBaseline = "middle";
          offCtx.fillStyle = color;
          offCtx.fillText(text, off.width/2, off.height/2);
          const imageData = offCtx.getImageData(0, 0, off.width, off.height);
          let pixels = [];
          for (let y = 0; y < off.height; y += pixelSize) {
            for (let x = 0; x < off.width; x += pixelSize) {
              let idx = (y * off.width + x) * 4 + 3;
              if (imageData.data[idx] > 128) pixels.push({x, y});
            }
          }
          for (let i = pixels.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [pixels[i], pixels[j]] = [pixels[j], pixels[i]];
          }
          return pixels;
        }

        function revealPixels(pixels, onComplete) {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          let drawn = 0;
          function drawStep() {
            for (let i = 0; i < appearSpeed && drawn < pixels.length; i++, drawn++) {
              const {x, y} = pixels[drawn];
              ctx.fillStyle = color;
              ctx.fillRect(x, y, pixelSize, pixelSize);
            }
            if (drawn < pixels.length) requestAnimationFrame(drawStep);
            else if (onComplete) setTimeout(onComplete, fadeDelay);
          }
          drawStep();
        }

        function fadeOutCanvas(duration, callback) {
          let opacity = 1;
          const step = 16 / duration;
          function fade() {
            opacity -= step;
            if (opacity <= 0) { canvas.style.opacity = 0; if (callback) callback(); }
            else { canvas.style.opacity = opacity; requestAnimationFrame(fade); }
          }
          fade();
        }

        const pixels = getTextPixels();
        revealPixels(pixels, () => fadeOutCanvas(fadeDuration, () => {
          $('#omom-screen').fadeOut(300, () => {
            $('#soundPrompt').fadeIn(300);
          });
        }));
      }).catch(err => {
        console.log("Erro ao carregar fonte, usando fallback", err);
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.font = `bold ${fontSize}px monospace`; ctx.textAlign = "center";
        ctx.textBaseline = "middle"; ctx.fillStyle = color;
        ctx.fillText(text, canvas.width/2, canvas.height/2);
        
        setTimeout(() => {
          fadeOutCanvas(fadeDuration, () => {
            $('#omom-screen').fadeOut(300, () => {
              $('#soundPrompt').fadeIn(300);
            });
          });
        }, fadeDelay);
      });
    }

    window.addEventListener('DOMContentLoaded', initOMOMAnimation);

    // =========================================================
    // 2. VARIÁVEIS DO SITE E ÁUDIO
    // =========================================================
    let allowSound = false;
    const memories = document.getElementById('memories');
    const whooshSound = document.getElementById('whooshSound');

    // Variáveis unificadas do Editor
    let textoModo = 'leitura';
    let textoFontSize = 18;
    let mundoAtual = '';

    function optimizeDesktopLayout() {
      if (window.innerWidth >= 1024) {
        const windowHeight = window.innerHeight;
        const menuHeight = windowHeight - 180;
        $('.symbols-container').css({ 'max-height': menuHeight + 'px', 'height': 'auto' });
      }
    }
    $(window).on('resize', function() {
      optimizeDesktopLayout();
      if (window.innerWidth >= 768 && $('#flipbook').is(':visible')) {
        $('#flipbook').css('background', '#fff');
      }
    });

    $('#btnYes').click(() => startSite(true));
    $('#btnNo').click(() => startSite(false));

    function createBackgroundPixels() {
      const menu = document.getElementById('menu');
      const existingPixels = menu.querySelector('.background-pixels');
      if (existingPixels) existingPixels.remove();
      
      const pixelsContainer = document.createElement('div');
      pixelsContainer.className = 'background-pixels';
      menu.appendChild(pixelsContainer);

      for (let i = 0; i < 160; i++) {
        const pixel = document.createElement('div');
        pixel.className = 'pixel';
        const size = 4;
        pixel.style.width = size + 'px'; pixel.style.height = size + 'px';
        pixel.style.left = Math.random() * 100 + '%'; pixel.style.top = Math.random() * 100 + '%';
        pixel.style.animationDelay = Math.random() * 3 + 's';
        pixel.style.animationDuration = (Math.random() * 2 + 2) + 's';
        pixelsContainer.appendChild(pixel);
      }
    }
    
    function startSite(sound) {
      allowSound = sound;
      $('#soundPrompt').hide();
      if (allowSound) {
        memories.volume = 0;
        memories.play().catch(() => {});
        let fadeInAudio = setInterval(() => {
          if (memories.volume < 0.95) memories.volume += 0.05;
          else { memories.volume = 1; clearInterval(fadeInAudio); }
        }, 50);
      }
      $('#menu').fadeIn(500, () => {
        createBackgroundPixels();
        setupWorldClickHandlers();
      });
    }

    // =========================================================
    // 3. LOGICA CENTRAL: EDITOR INJETADO VS. ARQUIVOS EXTERNOS
    // =========================================================
    function setupWorldClickHandlers() {
      $('.symbol.brither').off('click');
      
      $('.symbol.brither').on('click', function() {
        const world = $(this).data('world');
        console.log('Mundo selecionado:', world);
        
        if (allowSound && whooshSound) {
          try {
            whooshSound.currentTime = 0.1; whooshSound.volume = 0.6;
            const playPromise = whooshSound.play();
            if (playPromise !== undefined) playPromise.catch(e => console.log(e));
          } catch (error) {}
        }

        // Mundos que NÃO usam o editor de texto novo (buscam os scripts JS próprios)
        const mundosExcecao = ['batedores', 'porojka', 'veleywei', 'botychera'];

        if (mundosExcecao.includes(world)) {
          // Lógica antiga para os de exceção
          $('#menu').fadeOut(500, () => {
            showPixelTransition(() => {

    async function carregarTexto(nomeDoMundo) {
      const textoEl = document.getElementById('texto-conteudo');
      if (!textoEl) return;
      
      if (!window.db || !window.fsGetDoc) {
        console.warn('Aguardando conexão com banco de dados...');
        setTimeout(() => carregarTexto(nomeDoMundo), 500);
        return;
      }

      try {
        const ref = window.fsDoc(window.db, 'textos', nomeDoMundo);
        const snap = await window.fsGetDoc(ref);
        
        if (snap.exists()) {
          const dados = snap.data();
          textoEl.innerHTML = dados.conteudo || '';
          if (dados.tamanhoFonte) aplicarFonte(dados.tamanhoFonte);
          hidratarIlustracoes();
        } else {
          textoEl.innerHTML = '';
        }
      } catch (err) {
        console.error('Erro ao carregar texto:', err);
        textoEl.innerHTML = 'Erro ao carregar dados. Verifique sua conexão.';
      }
    }

    async function salvarTexto() {
      const textoEl = document.getElementById('texto-conteudo');
      const btnSalvar = document.getElementById('btn-salvar-texto');
      if (!textoEl || !mundoAtual) return;
      
      if (!window.db) return alert('Erro: Banco de dados não conectado.');

      try {
        const ref = window.fsDoc(window.db, 'textos', mundoAtual);
        await window.fsSetDoc(ref, {
          conteudo: textoEl.innerHTML,
          tamanhoFonte: textoFontSize,
          atualizadoEm: new Date().toISOString()
        });

      } catch (err) {
        console.error('Erro ao salvar texto:', err);
        btnSalvar.textContent = 'ERRO';
        setTimeout(() => { btnSalvar.textContent = 'SALVAR'; }, 1500);
      }
    }

    // =========================================================
    // 4B. UPLOAD DE IMAGENS PARA O CLOUDFLARE R2 (via Worker)
    // =========================================================

    const WORKER_UPLOAD_URL = "https://omom-ilustracoes.omomestudios.workers.dev";
    const WORKER_UPLOAD_TOKEN = "omom-7f9a2c8e1b4d6f3a";

    function blobParaWebp(blob, qualidade = 0.85, larguraMax = 1600) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
          let { width, height } = img;
          if (width > larguraMax) {
            height = Math.round(height * (larguraMax / width));
            width = larguraMax;
          }
          const canvas = document.createElement('canvas');
          canvas.width = width; canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          canvas.toBlob(
            (out) => out ? resolve(out) : reject(new Error('Falha ao converter para webp')),
            'image/webp',
            qualidade
          );
          URL.revokeObjectURL(img.src);
        };
        img.onerror = reject;
        img.src = URL.createObjectURL(blob);
      });
    }

    async function subirImagemParaStorage(blob, mundo, caminhoExistente = null) {
      if (!WORKER_UPLOAD_URL || WORKER_UPLOAD_URL.includes('SEU-WORKER')) {
        throw new Error('Worker do Cloudflare ainda não configurado (veja WORKER_UPLOAD_URL).');
      }
      const webpBlob = await blobParaWebp(blob);
      const caminho = caminhoExistente || `mundos/${mundo}/ilustracoes/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.webp`;

      const resp = await fetch(`${WORKER_UPLOAD_URL}/upload?path=${encodeURIComponent(caminho)}`, {
        method: 'POST',
        headers: {
          'Content-Type': 'image/webp',
          'Authorization': `Bearer ${WORKER_UPLOAD_TOKEN}`
        },
        body: webpBlob
      });

      if (!resp.ok) {
        const msg = await resp.text().catch(() => '');
        throw new Error(`Falha no upload (HTTP ${resp.status}): ${msg}`);
      }

      // Correção robusta para caso o worker responda com texto puro ou json irregular
      let responseText = await resp.text();
      let finalUrl = '';
      
      try {
        const data = JSON.parse(responseText);
        finalUrl = data.url;
      } catch (e) {
        if (responseText.startsWith('http')) {
          finalUrl = responseText.trim();
        }
      }

      if (!finalUrl) {
        finalUrl = `${WORKER_UPLOAD_URL}/${caminho}`;
      }

      return { url: finalUrl, caminho };
    }

    function sanitizarNomeArquivo(nome) {
      const limpo = nome
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '') // remove acentos
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/^-+|-+$/g, '')
        .slice(0, 60);
      return limpo || `ilustracao-${Date.now()}`;
    }

    async function inserirImagemNoTexto(blob, seletorSalvo, nomeEscolhido = null) {
      const textoEl = document.getElementById('texto-conteudo');
      if (!textoEl || !mundoAtual) {
        console.error('Não foi possível inserir a ilustração: textoEl ou mundoAtual ausentes.', { textoEl, mundoAtual });
        return;
      }

      const idTemp = 'img-pendente-' + Date.now();
      const placeholderHtml = `<span id="${idTemp}" style="display:inline-block;padding:8px 12px;border:1px dashed #999;color:#888;font-size:13px;">enviando ilustração…</span>`;

      const sel = window.getSelection();
      let inseridoComExecCommand = false;

      if (seletorSalvo && textoEl.contains(seletorSalvo.anchorNode)) {
        sel.removeAllRanges();
        sel.addRange(seletorSalvo);
      }

      if (!sel.rangeCount || !textoEl.contains(sel.getRangeAt(0).commonAncestorContainer)) {
        textoEl.focus();
        const range = document.createRange();
        range.selectNodeContents(textoEl);
        range.collapse(false);
        sel.removeAllRanges();
        sel.addRange(range);
      } else {
        textoEl.focus();
      }

      try {
        inseridoComExecCommand = document.execCommand('insertHTML', false, placeholderHtml);
      } catch (e) {
        inseridoComExecCommand = false;
      }

      if (!inseridoComExecCommand || !document.getElementById(idTemp)) {
        textoEl.insertAdjacentHTML('beforeend', placeholderHtml);
      }

      try {
        const caminhoDesejado = nomeEscolhido ? `mundos/${mundoAtual}/ilustracoes/${nomeEscolhido}.webp` : null;
        const { url, caminho } = await subirImagemParaStorage(blob, mundoAtual, caminhoDesejado);
        const placeholder = document.getElementById(idTemp);
        if (placeholder) {
          placeholder.replaceWith(criarIlustracaoElemento(url, caminho));
        }
      } catch (err) {
        console.error('Erro ao subir imagem:', err);
        const placeholder = document.getElementById(idTemp);
        if (placeholder) {
          placeholder.textContent = 'erro ao enviar ilustração';
          placeholder.style.color = '#c00';
          placeholder.style.borderColor = '#c00';
        }
      }
    }

    function configurarPasteDeImagem() {
      const textoEl = document.getElementById('texto-conteudo');
      if (!textoEl) return;
      textoEl.addEventListener('paste', (e) => {
        if (textoModo !== 'edicao') return;
        const items = (e.clipboardData || window.clipboardData).items;
        for (const item of items) {
          if (item.type && item.type.startsWith('image/')) {
            e.preventDefault();
            const blob = item.getAsFile();
            if (blob) inserirImagemNoTexto(blob);
            return;
          }
        }
      });
    }

        const arquivo = input.files && input.files[0];
        if (!arquivo) return;
        const urlLocal = URL.createObjectURL(arquivo);

        imgTemp.onload = () => {
          desenhoEditandoImg = imgEl;
          abrirTelaDesenhoComTamanho(imgTemp.naturalWidth, imgTemp.naturalHeight, imgTemp);
          URL.revokeObjectURL(urlLocal);
        };
        imgTemp.onerror = () => {
          alert('Não deu pra abrir esse arquivo como imagem.');

    function abrirTelaDesenhoComTamanho(LARGURA_PAPEL, ALTURA_PAPEL, imagemBase = null) {

      const selAtual = window.getSelection();
      seletorSalvoParaDesenho = (selAtual && selAtual.rangeCount > 0) ? selAtual.getRangeAt(0).cloneRange() : null;

      overlay.id = 'layer-desenho';
      overlay.innerHTML = `

          <div id="btn-desenho-desfazer" class="texto-btn">DESFAZER</div>
          <div id="btn-desenho-limpar" class="texto-btn">LIMPAR</div>
          <div id="btn-desenho-borracha" class="texto-btn">BORRACHA</div>
          <div style="display:flex; align-items:center; gap:4px;">
            <span style="color:#00ffe7; font-family:'Press Start 2P',monospace; font-size:9px;">COR</span>
            <input type="color" id="desenho-cor" value="#1a1a1a" style="width:32px; height:32px; padding:0; border:1px solid #00ffe7; background:none; cursor:pointer;">

      const canvas = document.getElementById('desenho-canvas');
      const ctx = canvas.getContext('2d', { willReadFrequently: true });
      const wrap = document.getElementById('desenho-canvas-wrap');

      canvas.width = LARGURA_PAPEL;
      canvas.height = ALTURA_PAPEL;
      if (imagemBase) {
        ctx.drawImage(imagemBase, 0, 0, canvas.width, canvas.height); 
      } else {
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      let zoom = Math.min(wrap.clientWidth / LARGURA_PAPEL, wrap.clientHeight / ALTURA_PAPEL) * 0.95;
      let desenhando = false;
      let modoBorracha = false;
      let ultimoPonto = null;
      let pontoMedioAnterior = null;
      let ultimoTempo = 0;
      let pointerIdAtivo = null;
      let historico = [];
      const espessuraBase = () => parseFloat(document.getElementById('desenho-espessura').value);
      const opacidadeBase = () => parseFloat(document.getElementById('desenho-opacidade').value) / 100;

      function aplicarZoom() {
        canvas.style.width = (LARGURA_PAPEL * zoom) + 'px';
        canvas.style.height = (ALTURA_PAPEL * zoom) + 'px';
        document.getElementById('desenho-zoom-display').textContent = Math.round(zoom * 100) + '%';
      }
      aplicarZoom();

      function salvarHistorico() {
        historico.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
        if (historico.length > 25) historico.shift(); 
      }
      salvarHistorico();

      function pontoCanvas(e) {
        const rect = canvas.getBoundingClientRect();
        return {
          x: (e.clientX - rect.left) * (canvas.width / rect.width),
          y: (e.clientY - rect.top) * (canvas.height / rect.height)
        };
      }

      function pontoMedio(a, b) {
        return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
      }

      function espessuraTraco(p1, p2, dt, e) {
        const base = espessuraBase();
        if (e.pointerType === 'pen' && e.pressure > 0) {
          return Math.max(0.6, base * (0.3 + e.pressure * 1.4));
        }
        const dist = Math.hypot(p2.x - p1.x, p2.y - p1.y);
        const vel = dt > 0 ? dist / dt : 0;
        const fator = Math.max(0.4, Math.min(1.3, 1.1 - vel * 0.04));
        return Math.max(0.8, base * fator);
      }

          btn.style.background = '';
          btn.style.color = '';
          btn.textContent = 'BORRACHA';
          label.textContent = 'LÁPIS';
        }
      }

      function iniciarTraco(e) {
        if (pointerIdAtivo !== null) return; 
        pointerIdAtivo = e.pointerId;
        e.preventDefault();
        desenhando = true;
        ultimoPonto = pontoCanvas(e);
        pontoMedioAnterior = ultimoPonto;
        ultimoTempo = performance.now();
      }
      function continuarTraco(e) {
        if (!desenhando || e.pointerId !== pointerIdAtivo) return;
        e.preventDefault();
        const p = pontoCanvas(e);
        const agora = performance.now();
        const dt = agora - ultimoTempo;

        ctx.globalCompositeOperation = modoBorracha ? 'destination-out' : 'source-over';
        ctx.strokeStyle = document.getElementById('desenho-cor').value;
        ctx.lineWidth = modoBorracha ? espessuraBase() * 3 : espessuraTraco(ultimoPonto, p, dt, e);

        let alpha = modoBorracha ? 1 : opacidadeBase();
        if (!modoBorracha && e.pointerType === 'pen' && e.pressure > 0) {
          alpha *= Math.max(0.3, e.pressure);
        }
        ctx.globalAlpha = alpha;

        const pontoMedioAtual = pontoMedio(ultimoPonto, p);
        ctx.beginPath();
        ctx.moveTo(pontoMedioAnterior.x, pontoMedioAnterior.y);
        ctx.quadraticCurveTo(ultimoPonto.x, ultimoPonto.y, pontoMedioAtual.x, pontoMedioAtual.y);
        ctx.stroke();

        pontoMedioAnterior = pontoMedioAtual;
        ultimoPonto = p;
        ultimoTempo = agora;
      }
      function finalizarTraco(e) {
        if (!desenhando || (e && e.pointerId !== undefined && e.pointerId !== pointerIdAtivo)) return;
        desenhando = false;
        pointerIdAtivo = null;
        ctx.globalCompositeOperation = 'source-over';
        salvarHistorico();
      }

      canvas.addEventListener('pointerdown', iniciarTraco);
      canvas.addEventListener('pointermove', continuarTraco);
      window.addEventListener('pointerup', finalizarTraco);
      window.addEventListener('pointercancel', finalizarTraco);

      document.getElementById('btn-desenho-borracha').onclick = () => alternarBorracha();

      function mudarZoom(delta) {
        zoom = Math.max(0.2, Math.min(4, zoom + delta));
        aplicarZoom();
      }
      document.getElementById('btn-desenho-zoom-mais').onclick = () => mudarZoom(0.15);
      document.getElementById('btn-desenho-zoom-menos').onclick = () => mudarZoom(-0.15);

      let pinchDist = null;
      wrap.addEventListener('touchstart', (e) => {
        if (e.touches.length === 2) {
          pinchDist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
        }
      }, { passive: true });
      wrap.addEventListener('touchmove', (e) => {
        if (e.touches.length === 2 && pinchDist !== null) {
          const novaDist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
          mudarZoom((novaDist - pinchDist) * 0.004);
          pinchDist = novaDist;
        }
      }, { passive: true });
      wrap.addEventListener('wheel', (e) => {
        if (e.ctrlKey || e.metaKey) {
          e.preventDefault();
          mudarZoom(-e.deltaY * 0.002);
        }
      }, { passive: false });

      document.getElementById('btn-desenho-desfazer').onclick = () => {
        if (historico.length > 1) {
          historico.pop();
          ctx.putImageData(historico[historico.length - 1], 0, 0);
        }
      };
      document.getElementById('btn-desenho-limpar').onclick = () => {
        if (!confirm('Limpar o sketch inteiro?')) return;
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        salvarHistorico();
      };
      document.getElementById('btn-desenho-fechar').onclick = fecharTelaDesenho;
      document.getElementById('btn-desenho-usar').onclick = () => {
        const imgEditando = desenhoEditandoImg;
        let nomeEscolhido = null;
        if (!imgEditando) {
          const digitado = prompt('Nome do arquivo (sem espaços/acentos) que vai pro Cloudflare.\nDeixe em branco pra gerar um nome automático:', '');
          if (digitado && digitado.trim()) nomeEscolhido = sanitizarNomeArquivo(digitado);
        }
        canvas.toBlob(async (blob) => {
          if (!blob) return;
          const seletorSalvo = seletorSalvoParaDesenho;
          fecharTelaDesenho();
          if (imgEditando) {
            await salvarEdicaoImagem(blob, imgEditando);
          } else {
            await inserirImagemNoTexto(blob, seletorSalvo, nomeEscolhido);
          }
        }, 'image/png');
      };

      desenhoState = { overlay };
    }

    function fecharTelaDesenho() {
      const overlay = document.getElementById('layer-desenho');
      if (overlay) overlay.remove();
      desenhoState = null;
      desenhoEditandoImg = null;
    }

    async function salvarEdicaoImagem(blob, imgEl) {
      const caminho = imgEl.dataset.caminho;
      if (!caminho) {
        console.error('Imagem sem data-caminho — foi inserida antes dessa versão do editor, não dá pra sobrescrever.');
        alert('Essa ilustração não tem um caminho de storage salvo (foi inserida numa versão antiga do editor). Não é possível editá-la no lugar — cole/desenhe uma nova.');
        return;
      }
      const srcAntigo = imgEl.src;
      imgEl.style.opacity = '0.4';
      try {
        const { url } = await subirImagemParaStorage(blob, mundoAtual, caminho);
        imgEl.src = url + (url.includes('?') ? '&' : '?') + 'v=' + Date.now();
        imgEl.dataset.caminho = caminho;
        imgEl.style.opacity = '1';
      } catch (err) {
        console.error('Erro ao salvar edição da imagem:', err);
        imgEl.src = srcAntigo;
        imgEl.style.opacity = '1';
        alert('Erro ao salvar a edição da ilustração. Tente de novo.');
      }
    }

    // =========================================================
    // 5. BOTÃO VOLTAR E TRANSIÇÕES
    // =========================================================
    $('#btnVoltar').click(() => {
      try {
        $('#flipbook-content').empty();
        mundoAtual = ''; 
        if(window.stopAllAnimations) window.stopAllAnimations(); 
        delete window.initFlipbook; delete window.initGlobe;
      } catch(e){}
      
      if (allowSound && whooshSound) {
        try { whooshSound.currentTime = 0.1; whooshSound.volume = 0.6; whooshSound.play().catch(e=>e); } catch (e) {}
      }
      
      showReversePixelTransition(() => {
        $('#flipbook').hide(); $('#btnVoltar').hide(); $('#flipbook-content').empty();
        
        $('html, body').css('background', '#000'); $('#menu').css('background', '#000'); $('#flipbook').css('background', ''); 
        
        if (allowSound) {
            memories.volume = 0; memories.play().catch(() => {});
            let fadeInAudio = setInterval(() => {
                if (memories.volume < 0.95) memories.volume += 0.05;
                else { memories.volume = 1; clearInterval(fadeInAudio); }
            }, 50);
        }
        
        createBackgroundPixels();
        $('#menu').fadeIn(500);
        setupWorldClickHandlers();
      });
    });

    function showPixelTransition(callback) {
      const canvas = document.createElement('canvas'); canvas.style.position = 'fixed'; canvas.style.inset = '0'; canvas.style.zIndex = '99999';
      canvas.width = window.innerWidth; canvas.height = window.innerHeight; document.body.appendChild(canvas);
      const ctx = canvas.getContext('2d'); const pixelSize = 9;
      const cols = Math.ceil(canvas.width / pixelSize); const rows = Math.ceil(canvas.height / pixelSize);
      let pixels = [];
      for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) pixels.push({x, y});
      for (let i = pixels.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [pixels[i], pixels[j]] = [pixels[j], pixels[i]]; }
      let drawn = 0;
      function drawStep() {
        for (let i = 0; i < 80 && drawn < pixels.length; i++, drawn++) {
          const {x, y} = pixels[drawn]; ctx.fillStyle = '#00ffe7'; ctx.fillRect(x * pixelSize, y * pixelSize, pixelSize, pixelSize);
        }
        if (drawn < pixels.length) requestAnimationFrame(drawStep);
        else setTimeout(() => { canvas.remove(); if (callback) callback(); }, 150);
      }
      drawStep();
    }

    function showReversePixelTransition(callback) { showPixelTransition(callback); }

    $(document).on('click', '.symbol.locked', function (e) {
      e.preventDefault(); const el = this; el.classList.add('show-lock');
      if (el._lockTimer) clearTimeout(el._lockTimer);
      el._lockTimer = setTimeout(() => { el.classList.remove('show-lock'); el._lockTimer = null; }, 1200);
    });
  </script>
