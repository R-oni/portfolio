<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMOM rascunhos</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #fff;
            font-family: 'VT323', monospace;
            margin: 0;
            padding: 20px;
        }
        
        h1 {
            font-family: 'Press Start 2P', cursive;
            text-align: center;
            color: #000;
            margin-bottom: 40px;
            padding-top: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        
        #add-world-btn {
            display: block;
            margin: 20px auto;
            padding: 10px 20px;
            background-color: #000;
            color: #fff;
            border: none;
            font-family: 'Press Start 2P', cursive;
            font-size: 14px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        #add-world-btn:hover {
            transform: scale(1.05);
        }
        
        #worlds-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin-top: 30px;
        }
        
        .world-btn-container {
            position: relative;
            display: inline-block;
            margin: 5px;
        }
        
        .world-btn {
            padding: 12px 24px;
            background-color: #333;
            color: #fff;
            border: none;
            border-radius: 5px;
            font-family: 'VT323', monospace;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .world-btn:hover {
            background-color: #555;
            transform: translateY(-3px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        
        .delete-world-btn {
            position: absolute;
            top: -8px;
            right: -8px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background-color: #f44336;
            color: white;
            border: none;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 10;
        }
        
        .world-btn-container:hover .delete-world-btn {
            opacity: 1;
        }
        
        #content-area {
            margin-top: 40px;
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }
        
        .text-block, .draw-block {
            width: 100%;
            margin-bottom: 20px;
            background-color: #f9f9f9;
            padding: 15px;
            border-radius: 5px;
            position: relative;
            cursor: pointer;
        }
        
        .text-block {
            border-left: 4px solid #333;
        }
        
        .draw-block {
            border-left: 4px solid #2196F3;
            text-align: center;
        }
        
        .text-content {
            font-family: 'VT323', monospace;
            font-size: 22px;
            line-height: 1.6;
            margin: 0;
            text-align: center;
            word-wrap: break-word;
        }
        
        .delete-btn {
            position: absolute;
            top: 5px;
            right: 5px;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background-color: #f44336;
            color: white;
            border: none;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.7;
            transition: opacity 0.2s;
        }
        
        .delete-btn:hover {
            opacity: 1;
        }
        
        .edit-btn {
            position: absolute;
            top: 5px;
            right: 35px;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background-color: #2196F3;
            color: white;
            border: none;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.7;
            transition: opacity 0.2s;
        }
        
        .edit-btn:hover {
            opacity: 1;
        }
        
        .add-btn-container {
            display: none;
            justify-content: center;
            margin: 20px 0;
            gap: 10px;
            transition: opacity 0.3s ease;
            opacity: 0;
            width: 100%;
        }
        
        .add-btn-container.visible {
            display: flex;
            opacity: 1;
        }
        
        .add-text-btn, .add-draw-btn {
            padding: 10px 15px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-family: 'VT323', monospace;
            font-size: 16px;
        }
        
        .add-draw-btn {
            background-color: #2196F3;
        }
        
        .text-input-container, .drawing-container {
            width: 100%;
            margin-bottom: 20px;
        }
        
        .text-input {
            width: 100%;
            min-height: 100px;
            padding: 15px;
            font-family: 'VT323', monospace;
            font-size: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
            resize: vertical;
            text-align: center;
            box-sizing: border-box;
        }
        
        .drawing-container {
            background-color: #fff;
            border-radius: 5px;
            border: 1px solid #ddd;
            overflow: hidden;
        }
        
        #drawing-canvas {
            display: block;
            background-color: white;
            cursor: crosshair;
            touch-action: none;
        }
        
        .drawing-toolbar {
            display: flex;
            padding: 10px;
            background-color: #f1f1f1;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .color-picker {
            width: 30px;
            height: 30px;
            border: none;
            cursor: pointer;
        }
        
        .size-slider {
            width: 80px;
            margin: 0 10px;
            cursor: pointer;
        }
        
        .controls {
            display: flex;
            justify-content: flex-end;
            margin-top: 10px;
            gap: 10px;
            padding: 0 10px 10px;
        }
        
        .btn {
            padding: 8px 15px;
            font-family: 'VT323', monospace;
            font-size: 18px;
            cursor: pointer;
            border: none;
            border-radius: 3px;
        }
        
        .save-btn {
            background-color: #4CAF50;
            color: white;
        }
        
        .cancel-btn, .clear-btn {
            background-color: #f44336;
            color: white;
        }
        
        .world-header {
            font-family: 'Press Start 2P', cursive;
            font-size: 20px;
            margin-bottom: 30px;
            text-align: center;
            color: #333;
        }
        
        .draw-image {
            max-width: 100%;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>OMOM rascunhos</h1>
        
        <button id="add-world-btn">+ Novo Mundo</button>
        
        <div id="worlds-container"></div>
        
        <div id="content-area">
            <div class="world-header" id="current-world-title"></div>
            <div id="text-blocks" style="width:100%;"></div>
        </div>
    </div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    
    <script>
        // Configuração do Firebase
        const firebaseConfig = {
          apiKey: "AIzaSyB-WI_nUBDmk5wljZWoLPx3ChFLT5jUt2U",
          authDomain: "fundamentos-omom.firebaseapp.com",
          databaseURL: "https://fundamentos-omom-default-rtdb.firebaseio.com",
          projectId: "fundamentos-omom",
          storageBucket: "fundamentos-omom.firebaseapp.com",
          messagingSenderId: "402132741780",
          appId: "1:402132741780:web:3f78aa356a12ef4ea64e81",
          measurementId: "G-RPG1VPWZ9L"
        };

        // Inicializar Firebase
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        
        // Elementos DOM
        const addWorldBtn = document.getElementById('add-world-btn');
        const worldsContainer = document.getElementById('worlds-container');
        const contentArea = document.getElementById('content-area');
        const textBlocks = document.getElementById('text-blocks');
        const currentWorldTitle = document.getElementById('current-world-title');
        
        // Variáveis globais
        let currentWorld = null;
        let insertPosition = null; // Posição onde inserir o próximo item

        // Carregar mundos existentes ao iniciar
        window.onload = function() {
            database.ref('worlds').once('value', (snapshot) => {
                const worlds = snapshot.val();
                if (worlds) {
                    Object.keys(worlds).forEach(worldId => {
                        createWorldButton(worldId, worlds[worldId].name);
                    });
                }
            });
        };

        // Abrir um mundo e seus conteúdos
        function openWorld(worldId, worldName) {
            currentWorld = worldId;
            currentWorldTitle.textContent = worldName;
            contentArea.style.display = 'flex';
            textBlocks.innerHTML = '';
            insertPosition = null;
            
            // Carregar conteúdos ordenados por timestamp
            database.ref(`worlds/${worldId}/contents`).orderByChild('createdAt').on('value', (snapshot) => {
                textBlocks.innerHTML = '';
                
                const contentItems = [];
                snapshot.forEach(childSnapshot => {
                    contentItems.push({
                        id: childSnapshot.key,
                        ...childSnapshot.val()
                    });
                });

                // Renderizar todos os itens
                contentItems.forEach(item => {
                    if (item.type === 'text') {
                        addTextBlock(item.content, item.id);
                    } else if (item.type === 'drawing') {
                        addDrawBlock(item.imageData, item.id);
                    }
                });

                // Adicionar botões iniciais se não houver conteúdo
                if (contentItems.length === 0) {
                    addInitialButtons();
                }
            });
        }

        // Adicionar botões iniciais
        function addInitialButtons() {
            const btnContainer = document.createElement('div');
            btnContainer.className = 'add-btn-container visible';
            
            const addTextBtn = document.createElement('button');
            addTextBtn.className = 'add-text-btn';
            addTextBtn.innerHTML = 'T';
            addTextBtn.title = 'Adicionar texto';
            addTextBtn.addEventListener('click', () => {
                insertPosition = 'start';
                createTextInput();
            });
            
            const addDrawBtn = document.createElement('button');
            addDrawBtn.className = 'add-draw-btn';
            addDrawBtn.innerHTML = '✏️';
            addDrawBtn.title = 'Adicionar desenho';
            addDrawBtn.addEventListener('click', () => {
                insertPosition = 'start';
                createDrawingArea();
            });
            
            btnContainer.appendChild(addTextBtn);
            btnContainer.appendChild(addDrawBtn);
            textBlocks.appendChild(btnContainer);
        }

        // Criar botão para um mundo
        function createWorldButton(worldId, worldName) {
            const container = document.createElement('div');
            container.className = 'world-btn-container';
            
            const button = document.createElement('button');
            button.className = 'world-btn';
            button.textContent = worldName;
            button.addEventListener('click', () => openWorld(worldId, worldName));
            
            const deleteBtn = document.createElement('button');
            deleteBtn.className = 'delete-world-btn';
            deleteBtn.innerHTML = '✕';
            deleteBtn.title = 'Excluir mundo';
            deleteBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                deleteWorld(worldId, container);
            });
            
            container.appendChild(button);
            container.appendChild(deleteBtn);
            worldsContainer.appendChild(container);
        }
        
        // Função para excluir um mundo
        function deleteWorld(worldId, containerElement) {
            if (confirm('Tem certeza que deseja excluir este mundo e todos os seus conteúdos?')) {
                database.ref(`worlds/${worldId}`).remove()
                .then(() => {
                    containerElement.remove();
                    if (currentWorld === worldId) {
                        contentArea.style.display = 'none';
                        currentWorld = null;
                    }
                    alert('Mundo excluído com sucesso!');
                })
                .catch(error => alert('Erro ao excluir mundo: ' + error.message));
            }
        }

        // Adicionar um bloco de texto
        function addTextBlock(content = '', textId = null) {
            const textBlock = document.createElement('div');
            textBlock.className = 'text-block';
            textBlock.dataset.contentId = textId || '';
            
            const formattedContent = content.replace(/\n/g, '<br>');
            textBlock.innerHTML = `<p class="text-content">${formattedContent}</p>`;
            
            // Botão de excluir
            const deleteBtn = document.createElement('button');
            deleteBtn.className = 'delete-btn';
            deleteBtn.innerHTML = '✕';
            deleteBtn.title = 'Remover texto';
            deleteBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                if (confirm('Tem certeza que deseja remover este texto?')) {
                    if (textId) database.ref(`worlds/${currentWorld}/contents/${textId}`).remove();
                }
            });
            
            textBlock.appendChild(deleteBtn);
            textBlocks.appendChild(textBlock);
            
            // Adicionar botões de ação
            addActionButtons(textBlock);
            
            // Evento de clique para mostrar botões
            textBlock.addEventListener('click', (e) => {
                showActionButtons(textBlock);
            });
            
            return textBlock;
        }
        
        // Adicionar um bloco de desenho
        function addDrawBlock(imageData, drawId = null) {
            const drawBlock = document.createElement('div');
            drawBlock.className = 'draw-block';
            drawBlock.dataset.contentId = drawId || '';
            
            const img = document.createElement('img');
            img.src = imageData;
            img.className = 'draw-image';
            img.alt = 'Desenho';
            drawBlock.appendChild(img);
            
            // Botão de excluir
            const deleteBtn = document.createElement('button');
            deleteBtn.className = 'delete-btn';
            deleteBtn.innerHTML = '✕';
            deleteBtn.title = 'Remover desenho';
            deleteBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                if (confirm('Tem certeza que deseja remover este desenho?')) {
                    if (drawId) database.ref(`worlds/${currentWorld}/contents/${drawId}`).remove();
                }
            });
            
            // Botão de editar
            const editBtn = document.createElement('button');
            editBtn.className = 'edit-btn';
            editBtn.innerHTML = '✎';
            editBtn.title = 'Editar desenho';
            editBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                editDrawing(drawId, imageData);
            });
            
            drawBlock.appendChild(deleteBtn);
            drawBlock.appendChild(editBtn);
            textBlocks.appendChild(drawBlock);
            
            // Adicionar botões de ação
            addActionButtons(drawBlock);
            
            // Evento de clique para mostrar botões
            drawBlock.addEventListener('click', (e) => {
                showActionButtons(drawBlock);
            });
            
            return drawBlock;
        }

        // Adicionar botões de ação após um bloco
        function addActionButtons(afterElement) {
            const btnContainer = document.createElement('div');
            btnContainer.className = 'add-btn-container';
            
            const addTextBtn = document.createElement('button');
            addTextBtn.className = 'add-text-btn';
            addTextBtn.innerHTML = 'T';
            addTextBtn.title = 'Adicionar texto';
            addTextBtn.addEventListener('click', () => {
                insertPosition = afterElement;
                createTextInput();
            });
            
            const addDrawBtn = document.createElement('button');
            addDrawBtn.className = 'add-draw-btn';
            addDrawBtn.innerHTML = '✏️';
            addDrawBtn.title = 'Adicionar desenho';
            addDrawBtn.addEventListener('click', () => {
                insertPosition = afterElement;
                createDrawingArea();
            });
            
            btnContainer.appendChild(addTextBtn);
            btnContainer.appendChild(addDrawBtn);
            afterElement.after(btnContainer);
        }

        // Mostrar botões de ação
        function showActionButtons(element) {
            // Ocultar todos os botões
            document.querySelectorAll('.add-btn-container').forEach(btn => {
                btn.classList.remove('visible');
            });
            
            // Mostrar o botão após o elemento clicado
            const nextElement = element.nextElementSibling;
            if (nextElement && nextElement.classList.contains('add-btn-container')) {
                nextElement.classList.add('visible');
            }
        }

        // Criar campo para adicionar texto
        function createTextInput() {
            document.querySelectorAll('.add-btn-container').forEach(c => c.classList.remove('visible'));
            
            const inputContainer = document.createElement('div');
            inputContainer.className = 'text-input-container';
            
            const textarea = document.createElement('textarea');
            textarea.className = 'text-input';
            textarea.placeholder = 'Digite seu texto aqui...';
            
            const controls = document.createElement('div');
            controls.className = 'controls';
            
            const saveButton = document.createElement('button');
            saveButton.className = 'btn save-btn';
            saveButton.textContent = 'Salvar';
            saveButton.addEventListener('click', () => {
                if (textarea.value.trim()) {
                    saveText(textarea.value);
                    inputContainer.remove();
                } else {
                    alert('Por favor, digite algum texto!');
                }
            });
            
            const cancelButton = document.createElement('button');
            cancelButton.className = 'btn cancel-btn';
            cancelButton.textContent = 'Cancelar';
            cancelButton.addEventListener('click', () => {
                inputContainer.remove();
            });
            
            controls.appendChild(cancelButton);
            controls.appendChild(saveButton);
            inputContainer.appendChild(textarea);
            inputContainer.appendChild(controls);
            
            // Inserir na posição correta
            if (insertPosition === 'start' || !insertPosition) {
                textBlocks.insertBefore(inputContainer, textBlocks.firstChild);
            } else {
                const nextElement = insertPosition.nextElementSibling;
                if (nextElement && nextElement.classList.contains('add-btn-container')) {
                    nextElement.after(inputContainer);
                } else {
                    insertPosition.after(inputContainer);
                }
            }
            
            textarea.focus();
        }

        // Criar área de desenho
        function createDrawingArea(editMode = false, existingDrawingId = null, existingImageData = null) {
            document.querySelectorAll('.add-btn-container').forEach(c => c.classList.remove('visible'));
            
            const drawingContainer = document.createElement('div');
            drawingContainer.className = 'drawing-container';
            
            const toolbar = document.createElement('div');
            toolbar.className = 'drawing-toolbar';
            
            const colorPicker = document.createElement('input');
            colorPicker.type = 'color';
            colorPicker.className = 'color-picker';
            colorPicker.value = '#000000';
            
            const sizeLabel = document.createElement('span');
            sizeLabel.textContent = 'Tamanho:';
            
            const sizeSlider = document.createElement('input');
            sizeSlider.type = 'range';
            sizeSlider.className = 'size-slider';
            sizeSlider.min = '1';
            sizeSlider.max = '20';
            sizeSlider.value = '3';
            
            const clearBtn = document.createElement('button');
            clearBtn.className = 'btn clear-btn';
            clearBtn.textContent = 'Limpar';
            
            toolbar.appendChild(colorPicker);
            toolbar.appendChild(sizeLabel);
            toolbar.appendChild(sizeSlider);
            toolbar.appendChild(clearBtn);
            
            const canvas = document.createElement('canvas');
            canvas.id = 'drawing-canvas';
            canvas.width = 600;
            canvas.height = 400;
            
            const controls = document.createElement('div');
            controls.className = 'controls';
            
            const saveBtn = document.createElement('button');
            saveBtn.className = 'btn save-btn';
            saveBtn.textContent = editMode ? 'Atualizar' : 'Salvar';
            
            const cancelBtn = document.createElement('button');
            cancelBtn.className = 'btn cancel-btn';
            cancelBtn.textContent = 'Cancelar';
            
            controls.appendChild(cancelBtn);
            controls.appendChild(saveBtn);
            
            drawingContainer.appendChild(toolbar);
            drawingContainer.appendChild(canvas);
            drawingContainer.appendChild(controls);
            
            // Inserir na posição correta
            if (insertPosition === 'start' || !insertPosition) {
                textBlocks.insertBefore(drawingContainer, textBlocks.firstChild);
            } else {
                const nextElement = insertPosition.nextElementSibling;
                if (nextElement && nextElement.classList.contains('add-btn-container')) {
                    nextElement.after(drawingContainer);
                } else {
                    insertPosition.after(drawingContainer);
                }
            }

            // Configurar canvas
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#fff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Carregar imagem existente se estiver editando
            if (editMode && existingImageData) {
                const img = new Image();
                img.onload = () => ctx.drawImage(img, 0, 0);
                img.src = existingImageData;
            }
            
            let isDrawing = false;
            let lastX = 0;
            let lastY = 0;

            function getMousePos(e) {
                const rect = canvas.getBoundingClientRect();
                return {
                    x: (e.clientX || e.touches[0].clientX) - rect.left,
                    y: (e.clientY || e.touches[0].clientY) - rect.top
                };
            }

            function startDrawing(e) {
                isDrawing = true;
                const pos = getMousePos(e);
                lastX = pos.x;
                lastY = pos.y;
            }

            function draw(e) {
                if (!isDrawing) return;
                
                const pos = getMousePos(e);
                
                ctx.beginPath();
                ctx.moveTo(lastX, lastY);
                ctx.lineTo(pos.x, pos.y);
                ctx.strokeStyle = colorPicker.value;
                ctx.lineWidth = sizeSlider.value;
                ctx.lineCap = 'round';
                ctx.stroke();
                
                lastX = pos.x;
                lastY = pos.y;
            }

            function stopDrawing() {
                isDrawing = false;
            }

            // Eventos de mouse
            canvas.addEventListener('mousedown', startDrawing);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', stopDrawing);
            canvas.addEventListener('mouseout', stopDrawing);

            // Eventos de toque
            canvas.addEventListener('touchstart', (e) => {
                e.preventDefault();
                startDrawing(e);
            });
            canvas.addEventListener('touchmove', (e) => {
                e.preventDefault();
                draw(e);
            });
            canvas.addEventListener('touchend', stopDrawing);

            // Limpar canvas
            clearBtn.addEventListener('click', () => {
                ctx.fillStyle = '#fff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            });

            // Salvar desenho
            saveBtn.addEventListener('click', () => {
                const imageData = canvas.toDataURL('image/png');
                if (editMode) {
                    updateDrawing(existingDrawingId, imageData);
                } else {
                    saveDrawing(imageData);
                }
                drawingContainer.remove();
            });

            // Cancelar
            cancelBtn.addEventListener('click', () => {
                drawingContainer.remove();
            });
        }

        // Salvar texto
        function saveText(content) {
            // Calcular timestamp baseado na posição
            let timestamp = Date.now();
            
            if (insertPosition && insertPosition !== 'start') {
                // Se inserindo após um elemento, usar seu timestamp + 1
                database.ref(`worlds/${currentWorld}/contents`).orderByChild('createdAt').once('value', (snapshot) => {
                    const items = [];
                    snapshot.forEach(child => {
                        items.push({
                            id: child.key,
                            ...child.val()
                        });
                    });
                    
                    // Encontrar o elemento de referência
                    const refIndex = items.findIndex(item => item.id === insertPosition.dataset.contentId);
                    if (refIndex !== -1 && refIndex + 1 < items.length) {
                        // Inserir entre dois elementos
                        const beforeTime = items[refIndex].createdAt;
                        const afterTime = items[refIndex + 1].createdAt;
                        timestamp = beforeTime + ((afterTime - beforeTime) / 2);
                    } else {
                        // Inserir no final
                        timestamp = items[refIndex].createdAt + 1000;
                    }
                    
                    // Salvar no Firebase
                    database.ref(`worlds/${currentWorld}/contents`).push({
                        type: 'text',
                        content: content,
                        createdAt: timestamp
                    });
                });
            } else {
                // Inserir no início
                database.ref(`worlds/${currentWorld}/contents`).push({
                    type: 'text',
                    content: content,
                    createdAt: timestamp
                });
            }
            
            insertPosition = null;
        }

        // Salvar desenho
        function saveDrawing(imageData) {
            // Calcular timestamp baseado na posição
            let timestamp = Date.now();
            
            if (insertPosition && insertPosition !== 'start') {
                // Se inserindo após um elemento, usar seu timestamp + 1
                database.ref(`worlds/${currentWorld}/contents`).orderByChild('createdAt').once('value', (snapshot) => {
                    const items = [];
                    snapshot.forEach(child => {
                        items.push({
                            id: child.key,
                            ...child.val()
                        });
                    });
                    
                    // Encontrar o elemento de referência
                    const refIndex = items.findIndex(item => item.id === insertPosition.dataset.contentId);
                    if (refIndex !== -1 && refIndex + 1 < items.length) {
                        // Inserir entre dois elementos
                        const beforeTime = items[refIndex].createdAt;
                        const afterTime = items[refIndex + 1].createdAt;
                        timestamp = beforeTime + ((afterTime - beforeTime) / 2);
                    } else {
                        // Inserir no final
                        timestamp = items[refIndex].createdAt + 1000;
                    }
                    
                    // Salvar no Firebase
                    database.ref(`worlds/${currentWorld}/contents`).push({
                        type: 'drawing',
                        imageData: imageData,
                        createdAt: timestamp
                    });
                });
            } else {
                // Inserir no início
                database.ref(`worlds/${currentWorld}/contents`).push({
                    type: 'drawing',
                    imageData: imageData,
                    createdAt: timestamp
                });
            }
            
            insertPosition = null;
        }

        // Editar desenho
        function editDrawing(drawingId, imageData) {
            insertPosition = null;
            createDrawingArea(true, drawingId, imageData);
        }

        // Atualizar desenho
        function updateDrawing(drawingId, imageData) {
            if (drawingId) {
                database.ref(`worlds/${currentWorld}/contents/${drawingId}`).update({
                    imageData: imageData
                });
            }
        }

        // Criar novo mundo
        addWorldBtn.addEventListener('click', () => {
            const worldName = prompt('Digite o nome do novo mundo:');
            if (worldName && worldName.trim()) {
                const worldRef = database.ref('worlds').push();
                worldRef.set({
                    name: worldName,
                    createdAt: firebase.database.ServerValue.TIMESTAMP
                }).then(() => {
                    createWorldButton(worldRef.key, worldName);
                }).catch(error => alert('Erro ao criar mundo: ' + error.message));
            }
        });
    </script>
</body>
</html>
