<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Frame Generator</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #222;
            color: #fff;
        }
        h1 {
            color: #fff;
            margin-bottom: 20px;
        }
        #frameCanvas {
            border: 2px solid #ccc;
            background-image: 
                linear-gradient(45deg, #666 25%, transparent 25%), 
                linear-gradient(-45deg, #666 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #666 75%),
                linear-gradient(-45deg, transparent 75%, #666 75%);
            background-size: 30px 30px;
            background-position: 0 0, 0 15px, 15px -15px, -15px 0px;
            max-width: 500px;
            max-height: 500px;
            margin-bottom: 20px;
        }
        button {
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
            background-color: #00ffe7;
            color: black;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            transition: all 0.3s;
        }
        button:hover {
            background-color: #66fff2;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <h1>3000x3750 Pixel Frame Generator</h1>
    <canvas id="frameCanvas" width="3000" height="3750"></canvas>
    <button id="downloadBtn">Download PNG Frame</button>

    <script>
        const canvas = document.getElementById('frameCanvas');
        const ctx = canvas.getContext('2d');
        const downloadBtn = document.getElementById('downloadBtn');

        // Configurações
        const WIDTH = 3000;
        const HEIGHT = 3750;
        const COLOR1 = '#00ffe7';
        const COLOR2 = '#000';

        // Borda de 4% nas laterais e topo
        const borderLeft = Math.floor(WIDTH * 0.05);
        const borderRight = Math.floor(WIDTH * 0.05);
        const borderTop = Math.floor(WIDTH * 0.05);
        const borderBottom = Math.floor(WIDTH * 0.05);

        // Área interna (transparente)
        const innerX = borderLeft;
        const innerY = borderTop;
        const innerW = WIDTH - borderLeft - borderRight;
        const innerH = HEIGHT - borderTop - borderBottom;

        // Tamanho do grid (ajuste para mais/menos quadriculado)
        const GRID_COLS = 70;
        const GRID_ROWS = 70;
        const cellW = Math.ceil(WIDTH / GRID_COLS);
        const cellH = Math.ceil(HEIGHT / GRID_ROWS);

        function drawFrame() {
            ctx.clearRect(0, 0, WIDTH, HEIGHT);

            // Preenche toda a área com transparência (já está limpa)

            // Preenche a borda com o padrão quadriculado
            for (let row = 0; row < GRID_ROWS; row++) {
                for (let col = 0; col < GRID_COLS; col++) {
                    const x = col * cellW;
                    const y = row * cellH;
                    // Verifica se está na borda
                    const inLeft = x + cellW <= borderLeft;
                    const inRight = x >= WIDTH - borderRight;
                    const inTop = y + cellH <= borderTop;
                    const inBottom = y >= HEIGHT - borderBottom;
                    if (inLeft || inRight || inTop || inBottom) {
                        const color = Math.random() < 0.5 ? COLOR1 : COLOR2;
                        ctx.fillStyle = color;
                        ctx.fillRect(x, y, cellW, cellH);
                    }
                }
            }
            // O interior permanece transparente
        }

        downloadBtn.addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = 'pixel-frame-3000x3750.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        });

        drawFrame();
    </script>

</body>
</html>
